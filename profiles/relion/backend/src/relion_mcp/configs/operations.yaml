  remove_duplicate_particles:
    description: Remove duplicated particles closer than an explicit physical distance with native relion_star_handler, writing new retained- and removed-particle STAR files.
    operation_type: processing
    category: processing
    supported_backends: [relion]
    modifies_backend_project: true
    creates_files: true
    destructive: false
    authorization_required: true
    authorization_source: user_task_request
    requires_human_approval: false
    required_inputs:
      particles:
        result_types: [selected_particles, classified_particles, refine3d_particles]
        required: true
        description: Native-runnable SPA particle STAR to deduplicate. data_particles must include finite X/Y coordinates and origins, non-null image and micrograph names, and an optics group; the tomography-triggering rlnCenteredCoordinateZAngst column is rejected. Native-bound input must be valid UTF-8 without NUL bytes or carriage returns. Particle and optics loops must use unambiguous native block/loop structure, valid declarations, complete physical rows, unique logical labels, supported ordinary loop columns, native token and string round-trip semantics, and values valid for the pinned RELION 5.0 metadata types; null markers are rejected for recognized non-string types. The particle loop must be the first data construct, and data_optics must contain exactly one loop without a scalar list. The optics table must include the fields required by RELION and list contiguous group IDs 1..N in row order so native loading cannot renumber them. A fresh unaligned extraction without origin columns is rejected. The input file is never modified in place.
    params:
      duplicate_distance_A:
        type: float
        required: true
        unit: angstrom
        min: 0.000001
        description: Centre-to-centre separation in Angstrom below which two particles are treated as the same particle; derive it from measured particle geometry, never from a tutorial value.
        exposure: user_overridable
        source: user_override
        param_id: duplicate_distance_A
        category: derived
        allowed_sources: [derived, sample_hypothesis, user_override]
        authority_order: [user_override, derived, sample_hypothesis]
        dependency_scope: local
        impacts: [particle_geometry]
      image_pixel_size_A:
        type: float
        required: false
        unit: angstrom
        min: 0.000001
        description: Pre-extraction micrograph coordinate pixel size always passed to native --image_angpix. It is inferred from rlnMicrographPixelSize for every referenced optics group; do not substitute rlnMicrographOriginalPixelSize or rlnImagePixelSize. An explicit verified value is required whenever authoritative micrograph-scale metadata is absent and must match it when present.
        exposure: user_overridable
        source: input_metadata
        param_id: image_pixel_size_A
        category: derived
        allowed_sources: [input_metadata, derived, user_override]
        authority_order: [input_metadata, user_override, derived]
        dependency_scope: local
        impacts: []
      output_star:
        type: str
        required: true
        description: Explicit project-relative retained-particle STAR beneath Deduplicate/. This path and RELION's implicit sibling <stem>_removed.star are privately staged, validated as an exact count, image-identity, and type-aware complete-row-metadata partition with at least one retained row and unchanged retained optics metadata. A nonempty removed sidecar may use the named data_particles block from newer RELION builds or the deployed beta's legal unnamed data_ block; this legacy exception does not apply to inputs or retained outputs. The native zero-byte no-removals sidecar is accepted, but a removed sidecar with optics is not. Both outputs are published as new files only; either existing destination is refused.
        exposure: user_overridable
        source: user_override
        param_id: output_star
        category: input_binding
        allowed_sources: [user_override]
        authority_order: [user_override]
        dependency_scope: local
        impacts: []
    expected_results:
      - result_type: selected_particles
    backend_support:
      relion:
        supported: true
        support_level: execution_ready

