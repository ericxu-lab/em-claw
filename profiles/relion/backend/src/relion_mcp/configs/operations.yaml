        param_id: auto_select_2d_classes
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: []
      minimum_selection_score:
        type: float
        required: false
        min: 0
        description: Minimum class-ranker score for automatic 2D class selection.
        exposure: user_overridable
        source: user_or_agent
        param_id: minimum_selection_score
        category: processing_standard
        strategy_selectable: true
        allowed_sources: [strategy_intent, user_override, workflow_default]
        authority_order: [strategy_intent, user_override, workflow_default]
        dependency_scope: local
        impacts: [particle_selection]
      select_by_metadata_values:
        type: bool
        required: false
        default: false
        description: Run non-interactively by filtering the particle STAR on one metadata label.
        exposure: user_overridable
        source: user_override
        param_id: select_by_metadata_values
        category: processing_standard
        allowed_sources: [user_override]
        authority_order: [user_override]
        dependency_scope: local
        impacts: [particle_selection]
      selection_label:
        type: str
        required: false
        description: RELION metadata label used for non-interactive subset selection.
        exposure: expert_only
        source: user_override
        param_id: selection_label
        category: processing_standard
        allowed_sources: [user_override]
        authority_order: [user_override]
        dependency_scope: local
        impacts: [particle_selection]
      selection_minimum:
        type: int
        required: false
        description: Inclusive minimum metadata value for non-interactive selection.
        exposure: user_overridable
        source: user_override
        param_id: selection_minimum
        category: processing_standard
        allowed_sources: [user_override]
        authority_order: [user_override]
        dependency_scope: local
        impacts: [particle_selection]
      selection_maximum:
        type: int
        required: false
        description: Inclusive maximum metadata value for non-interactive selection.
        exposure: user_overridable
        source: user_override
        param_id: selection_maximum
        category: processing_standard
        allowed_sources: [user_override]
        authority_order: [user_override]
        dependency_scope: local
        impacts: [particle_selection]
      recenter_class_averages:
        type: bool
        required: false
        default: false
        description: >
          Whether to re-center selected 2D class averages on their center of
          mass. RELION's class_ranker (auto_select_2d_classes) does not
          support re-centering or regrouping and aborts if either is enabled,
          so this must default to false for automatic class-ranker selection;
          set true only for a manual/exact class selection intended to
          produce autopicking templates.
        exposure: user_overridable
        source: workflow_default
        param_id: recenter_class_averages
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results:
      - result_type: selected_particles
    backend_support:
      relion:
        supported: true
        mapping_ref: particle_selection
        support_level: schedule_mappable

