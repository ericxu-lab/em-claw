operations:
  check_backend_available:
    description: Check whether a backend environment appears available.
    operation_type: backend_inspection
    category: backend_inspection
    supported_backends: [auto, mock, relion]
    modifies_backend_project: false
    creates_files: false
    destructive: false
    requires_human_approval: false
    expected_output_type: backend_status_report
    required_inputs: {}
    params:
      backend_name:
        type: enum
        allowed: [relion]
        required: true
        description: Backend environment to inspect.
        exposure: workflow_default
        source: workflow_default
        param_id: backend_name
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap]
        authority_order: [project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results: []
    backend_support:
      relion:
        supported: true

  check_backend_project_state:
    description: Check the readiness state of a native backend project workspace.
    operation_type: backend_inspection
    category: backend_inspection
    supported_backends: [relion]
    modifies_backend_project: false
    creates_files: false
    destructive: false
    requires_human_approval: false
    expected_output_type: backend_project_state_report
    required_inputs: {}
    params:
      backend_project_id:
        type: str
        required: true
        description: EMClaw backend project reference.
        exposure: workflow_default
        source: user_or_agent
        param_id: backend_project_id
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, user_override]
        authority_order: [project_bootstrap, user_override, workflow_default]
        dependency_scope: local
        impacts: []
      expected_state:
        type: enum
        allowed:
          - directory_missing
          - directory_exists_but_not_backend_project
          - backend_project_exists
          - backend_project_exists_but_invalid
          - backend_project_ready
        required: false
        description: Expected backend project state.
        exposure: workflow_default
        source: workflow_default
        param_id: expected_state
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap]
        authority_order: [project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results: []
    backend_support:
      relion:
        supported: true

  initialize_backend_project:
    description: Initialize a native backend project workspace for an authorized task.
    operation_type: backend_setup
    category: backend_setup
    supported_backends: [relion]
    modifies_backend_project: true
    creates_files: true
    destructive: false
    authorization_required: true
    authorization_source: user_task_request
    requires_human_approval: false
    expected_output_type: backend_project
    required_inputs: {}
    params:
      backend_project_id:
        type: str
        required: true
        description: EMClaw backend project reference.
        exposure: workflow_default
        source: user_or_agent
        param_id: backend_project_id
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, user_override]
        authority_order: [project_bootstrap, user_override, workflow_default]
        dependency_scope: local
        impacts: []
      display_name:
        type: str
        required: false
        description: Human-readable backend project name.
        exposure: user_overridable
        source: user_or_agent
        param_id: display_name
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, user_override]
        authority_order: [project_bootstrap, user_override, workflow_default]
        dependency_scope: local
        impacts: []
      pipeline_name:
        type: str
        required: false
        description: Native backend pipeline name.
        exposure: expert_only
        source: workflow_default
        param_id: pipeline_name
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap]
        authority_order: [project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results: []
    backend_support:
      relion:
        supported: true

  attach_backend_project:
    description: Attach an existing native backend project workspace after approval.
    operation_type: backend_setup
    category: backend_setup
    supported_backends: [relion]
    modifies_backend_project: true
    creates_files: false
    destructive: false
    authorization_required: true
    authorization_source: user_task_request
    requires_human_approval: false
    expected_output_type: backend_project
    required_inputs: {}
    params:
      backend_project_id:
        type: str
        required: true
        description: EMClaw backend project reference.
        exposure: workflow_default
        source: user_or_agent
        param_id: backend_project_id
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, user_override]
        authority_order: [project_bootstrap, user_override, workflow_default]
        dependency_scope: local
        impacts: []
      display_name:
        type: str
        required: false
        description: Human-readable backend project name.
        exposure: user_overridable
        source: user_or_agent
        param_id: display_name
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, user_override]
        authority_order: [project_bootstrap, user_override, workflow_default]
        dependency_scope: local
        impacts: []
      pipeline_name:
        type: str
        required: false
        description: Native backend pipeline name.
        exposure: expert_only
        source: workflow_default
        param_id: pipeline_name
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap]
        authority_order: [project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results: []
    backend_support:
      relion:
        supported: true

  scan_backend_project:
    description: Read a native backend project and register discovered JobResults.
    operation_type: backend_inspection
    category: backend_inspection
    supported_backends: [relion]
    modifies_backend_project: false
    creates_files: false
    destructive: false
    requires_human_approval: false
    expected_output_type: job_result_registry
    required_inputs: {}
    params:
      backend_project_id:
        type: str
        required: true
        description: EMClaw backend project reference.
        exposure: workflow_default
        source: user_or_agent
        param_id: backend_project_id
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, user_override]
        authority_order: [project_bootstrap, user_override, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results: []
    backend_support:
      relion:
        supported: true

  schedule_backend_job:
    description: Schedule a validated backend job request after policy and approval checks.
    operation_type: execution_control
    category: execution_control
    supported_backends: [relion]
    modifies_backend_project: true
    creates_files: true
    destructive: false
    authorization_required: true
    authorization_source: user_task_request
    requires_human_approval: false
    expected_output_type: backend_run
    required_inputs: {}
    params:
      backend_project_id:
        type: str
        required: true
        description: EMClaw backend project reference.
        exposure: mapped_internal
        source: backend_policy
        param_id: backend_project_id
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, resource_allocator]
        authority_order: [resource_allocator, project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results: []
    backend_support:
      relion:
        supported: true

  run_backend_job:
    description: Run a scheduled backend job after policy and approval checks.
    operation_type: execution_control
    category: execution_control
    supported_backends: [relion]
    modifies_backend_project: true
    creates_files: true
    destructive: false
    authorization_required: true
    authorization_source: user_task_request
    requires_human_approval: false
    expected_output_type: backend_run
    required_inputs: {}
    params:
      backend_project_id:
        type: str
        required: true
        description: EMClaw backend project reference.
        exposure: mapped_internal
        source: backend_policy
        param_id: backend_project_id
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, resource_allocator]
        authority_order: [resource_allocator, project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results: []
    backend_support:
      relion:
        supported: true

  check_backend_job_completion:
    description: Check native backend job completion state without modifying outputs.
    operation_type: execution_control
    category: execution_control
    supported_backends: [relion]
    modifies_backend_project: false
    creates_files: false
    destructive: false
    requires_human_approval: false
    expected_output_type: backend_job_status
    required_inputs: {}
    params:
      backend_project_id:
        type: str
        required: true
        description: EMClaw backend project reference.
        exposure: mapped_internal
        source: backend_policy
        param_id: backend_project_id
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, resource_allocator]
        authority_order: [resource_allocator, project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results: []
    backend_support:
      relion:
        supported: true

  register_backend_job_results:
    description: Register completed backend job outputs as EMClaw JobResults.
    operation_type: execution_control
    category: execution_control
    supported_backends: [relion]
    modifies_backend_project: false
    creates_files: false
    destructive: false
    requires_human_approval: false
    expected_output_type: job_result_registry
    required_inputs: {}
    params:
      backend_project_id:
        type: str
        required: true
        description: EMClaw backend project reference.
        exposure: mapped_internal
        source: backend_policy
        param_id: backend_project_id
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, resource_allocator]
        authority_order: [resource_allocator, project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
    expected_results: []
    backend_support:
      relion:
        supported: true

  import_movies:
    description: Import movie or micrograph input metadata into a backend project.
    operation_type: transfer
    category: transfer
    supported_backends: [relion]
    modifies_backend_project: true
    creates_files: true
    authorization_required: true
    authorization_source: user_task_request
    requires_human_approval: false
    required_inputs:
      source_movies:
        result_types: [raw_movies]
        required: true
        description: Registered external raw movie or micrograph input.
    params:
      raw_movie_glob:
        type: str
        required: true
        description: Workflow-relative raw movie glob for the RELION tutorial Import.
        exposure: workflow_default
        source: workflow_default
        param_id: raw_movie_glob
        category: input_binding
        allowed_sources: [workflow_default, project_bootstrap, input_metadata]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
      is_multiframe:
        type: bool
        required: false
        default: true
        description: Whether the input images are multi-frame movies.
        exposure: workflow_default
        source: workflow_default
        param_id: is_multiframe
        category: processing_standard
        allowed_sources: [input_metadata, project_bootstrap, workflow_default]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
      optics_group_name:
        type: str
        required: false
        default: opticsGroup1
        description: RELION optics group name for imported movies.
        exposure: workflow_default
        source: workflow_default
        param_id: optics_group_name
        category: microscopy_metadata
        allowed_sources: [input_metadata, project_bootstrap, workflow_default]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: project
        impacts: []
      pixel_size_A:
        param_id: acquisition_pixel_size_A
        type: float
        category: microscopy_metadata
        required: true
        unit: angstrom
        min: 0
        description: Pixel size for imported movies.
        exposure: user_overridable
        source: workflow_default
        allowed_sources: [input_metadata, project_bootstrap, workflow_default]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: project
        impacts: [particle_pixel_size_A, box_size_A]
      voltage_kv:
        param_id: microscope_voltage_kv
        type: float
        category: microscopy_metadata
        required: false
        unit: kV
        min: 0
        description: Microscope voltage.
        exposure: workflow_default
        source: workflow_default
        allowed_sources: [input_metadata, project_bootstrap, workflow_default]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: project
        impacts: [ctf_metadata]
      spherical_aberration_mm:
        param_id: microscope_spherical_aberration_mm
        type: float
        category: microscopy_metadata
        required: false
        unit: mm
        min: 0
        description: Microscope spherical aberration.
        exposure: workflow_default
        source: workflow_default
        allowed_sources: [input_metadata, project_bootstrap, workflow_default]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: project
        impacts: [ctf_metadata]
      amplitude_contrast:
        param_id: microscope_amplitude_contrast
        type: float
        category: microscopy_metadata
        required: false
        min: 0
        max: 1
        description: Amplitude contrast fraction.
        exposure: workflow_default
        source: workflow_default
        allowed_sources: [input_metadata, project_bootstrap, workflow_default]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: project
        impacts: [ctf_metadata]
    expected_results:
      - result_type: imported_movies
    backend_support:
      relion:
        supported: true
        mapping_ref: import_movies
        support_level: schedule_mappable

  motion_correction:
    description: Correct beam-induced motion in imported movie data.
    operation_type: processing
    category: processing
    supported_backends: [relion]
    modifies_backend_project: true
    creates_files: true
    authorization_required: true
    authorization_source: user_task_request
    requires_human_approval: false
    required_inputs:
      movies:
        result_types: [imported_movies]
        required: true
        description: Imported movies to motion-correct.
    params:
      number_of_mpi:
        type: int
        required: false
        min: 1
        description: MPI process count.
        exposure: expert_only
        source: workflow_default
        param_id: number_of_mpi
        category: resource_request
        allowed_sources: [workflow_default, user_override, resource_allocator]
        authority_order: [resource_allocator, user_override, workflow_default]
        dependency_scope: local
        impacts: [runtime_resources]
      number_of_threads:
        type: int
        required: false
        min: 1
        description: Thread count per process.
        exposure: expert_only
        source: workflow_default
        param_id: number_of_threads
        category: resource_request
        allowed_sources: [workflow_default, user_override, resource_allocator]
        authority_order: [resource_allocator, user_override, workflow_default]
        dependency_scope: local
        impacts: [runtime_resources]
      submit_to_queue:
        type: bool
        required: false
        default: false
        description: Whether to submit through backend queue policy.
        exposure: expert_only
        source: backend_policy
        param_id: submit_to_queue
        category: resource_request
        allowed_sources: [workflow_default, user_override, resource_allocator]
        authority_order: [resource_allocator, user_override, workflow_default]
        dependency_scope: local
        impacts: [runtime_resources]
      patch_x:
        type: str
        required: false
        default: "1"
        description: Number of motion-correction patches in X.
        exposure: user_overridable
        source: workflow_default
        param_id: patch_x
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: []
      patch_y:
        type: str
        required: false
        default: "1"
        description: Number of motion-correction patches in Y.
        exposure: user_overridable
        source: workflow_default
        param_id: patch_y
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: []
      gain_reference:
        param_id: gain_reference
        type: str
        category: input_binding
        required: false
        description: Optional gain-reference image for motion correction.
        exposure: user_overridable
        source: user_or_agent
        allowed_sources: [workflow_default, project_bootstrap, input_metadata, user_override]
        authority_order: [input_metadata, project_bootstrap, user_override, workflow_default]
        dependency_scope: local
        impacts: []
      gain_rotation:
        type: int
        required: false
        default: 0
        min: 0
        max: 3
        description: Gain-reference rotation in clockwise 90-degree steps.
        exposure: user_overridable
        source: workflow_default
        param_id: gain_rotation
        category: microscopy_metadata
        allowed_sources: [input_metadata, project_bootstrap, workflow_default]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: project
        impacts: []
      gain_flip:
        type: int
        required: false
        default: 0
        min: 0
        max: 2
        description: Gain-reference flip mode.
        exposure: user_overridable
        source: workflow_default
        param_id: gain_flip
        category: microscopy_metadata
        allowed_sources: [input_metadata, project_bootstrap, workflow_default]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: project
        impacts: []
      use_relion_own_motioncor:
        type: bool
        required: false
        default: true
        description: Whether to use RELION's own MotionCor implementation.
        exposure: user_overridable
        source: workflow_default
        param_id: use_relion_own_motioncor
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: []
      motioncor2_executable:
        type: str
        required: false
        description: Optional UCSF MotionCor2 executable path.
        exposure: expert_only
        source: project_bootstrap
        param_id: motioncor2_executable
        category: backend_option
        allowed_sources: [workflow_default, project_bootstrap, explicit_runtime_override]
        authority_order: [explicit_runtime_override, project_bootstrap, workflow_default]
        dependency_scope: local
        impacts: []
      defect_file:
        type: str
        required: false
        description: Optional defect file or defect map.
        exposure: expert_only
        source: user_or_agent
        param_id: defect_file
        category: input_binding
        allowed_sources: [workflow_default, project_bootstrap, input_metadata, user_override]
        authority_order: [input_metadata, project_bootstrap, user_override, workflow_default]
        dependency_scope: local
        impacts: []
      gpu_ids:
        type: str
        category: resource_allocation
        required: false
        description: GPU IDs for UCSF MotionCor2 execution.
        exposure: expert_only
        source: resource_allocator
        allowed_sources: [resource_allocator, explicit_runtime_override]
        authority_order: [explicit_runtime_override, resource_allocator]
        param_id: gpu_ids
        dependency_scope: local
        impacts: []
      dose_per_frame:
        param_id: dose_per_frame_e_per_A2
        type: float
        category: microscopy_metadata
        required: false
        min: 0
        description: Electron dose per movie frame in electrons per square Angstrom.
        exposure: user_overridable
        source: workflow_default
        allowed_sources: [input_metadata, project_bootstrap, workflow_default]
        authority_order: [input_metadata, project_bootstrap, workflow_default]
        dependency_scope: project
        impacts: []
    expected_results:
      - result_type: motion_corrected_micrographs
    backend_support:
      relion:
        supported: true
        mapping_ref: motion_correction
        support_level: schedule_mappable

  ctf_estimation:
    description: Estimate CTF parameters for motion-corrected micrographs.
    operation_type: processing
    category: processing
    supported_backends: [relion]
    modifies_backend_project: true
    creates_files: true
    authorization_required: true
    authorization_source: user_task_request
    requires_human_approval: false
    required_inputs:
      micrographs:
        result_types: [motion_corrected_micrographs]
        required: true
        description: Motion-corrected micrographs.
    params:
      number_of_mpi:
        type: int
        required: false
        min: 1
        description: MPI process count.
        exposure: expert_only
        source: workflow_default
        param_id: number_of_mpi
        category: resource_request
        allowed_sources: [workflow_default, user_override, resource_allocator]
        authority_order: [resource_allocator, user_override, workflow_default]
        dependency_scope: local
        impacts: [runtime_resources]
      submit_to_queue:
        type: bool
        required: false
        default: false
        description: Whether to submit through backend queue policy.
        exposure: expert_only
        source: backend_policy
        param_id: submit_to_queue
        category: resource_request
        allowed_sources: [workflow_default, user_override, resource_allocator]
        authority_order: [resource_allocator, user_override, workflow_default]
        dependency_scope: local
        impacts: [runtime_resources]
      box_size_pix:
        type: int
        required: false
        min: 1
        default: 512
        description: FFT box size for CTFFIND estimation in pixels.
        exposure: user_overridable
        source: workflow_default
        param_id: box_size_pix
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: [ctf_estimation_search]
      min_resolution_A:
        type: float
        required: false
        min: 0
        default: 30
        description: Minimum resolution for CTFFIND estimation.
        exposure: user_overridable
        source: workflow_default
        param_id: min_resolution_A
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: [local_processing_behavior]
      max_resolution_A:
        type: float
        required: false
        min: 0
        default: 5
        description: Maximum resolution for CTFFIND estimation.
        exposure: user_overridable
        source: workflow_default
        param_id: max_resolution_A
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: [local_processing_behavior]
      min_defocus_A:
        type: float
        required: false
        min: 0
        default: 5000
        description: Minimum defocus search value.
        exposure: user_overridable
        source: workflow_default
        param_id: min_defocus_A
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: [local_processing_behavior]
      max_defocus_A:
        type: float
        required: false
        min: 0
        default: 50000
        description: Maximum defocus search value.
        exposure: user_overridable
        source: workflow_default
        param_id: max_defocus_A
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: [local_processing_behavior]
      defocus_step_A:
        type: float
        required: false
        min: 0
        default: 500
        description: Defocus search step size.
        exposure: user_overridable
        source: workflow_default
        param_id: defocus_step_A
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: [local_processing_behavior]
      astigmatism_A:
        type: float
        required: false
        min: 0
        default: 100
        description: Amount of astigmatism for CTFFIND search.
        exposure: user_overridable
        source: workflow_default
        param_id: astigmatism_A
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: [local_processing_behavior]
      ctf_window_size_pix:
        type: int
        required: false
        default: -1
        description: Window size for CTF estimation; negative uses the full micrograph.
        exposure: user_overridable
        source: workflow_default
        param_id: ctf_window_size_pix
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: [local_processing_behavior]
      use_ctffind4:
        type: bool
        required: false
        default: true
        description: Whether to use CTFFIND-4.1 for CTF estimation. RELION requires an
          explicit CTFFIND4-or-Gctf selection; Gctf is not exposed in this contract, so
          this must default to true.
        exposure: user_overridable
        source: workflow_default
        param_id: use_ctffind4
        category: processing_standard
        allowed_sources: [workflow_default, user_override]
        authority_order: [user_override, workflow_default]
        dependency_scope: local
        impacts: []
      use_power_spectra_from_motioncorr:
        type: bool
        required: false
