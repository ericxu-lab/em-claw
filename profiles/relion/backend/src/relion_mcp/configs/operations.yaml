  particle_selection:
    description: Select particle subsets or class subsets from an existing particle JobResult.
    operation_type: validation
    category: validation
    supported_backends: [relion]
    modifies_backend_project: true
    creates_files: true
    authorization_required: true
    authorization_source: user_task_request
    requires_human_approval: false
    required_inputs:
      particles:
        result_types: [extracted_particles, selected_particles, classified_particles]
        required: false
        description: Particle JobResult to select from.
      classes:
        result_types: [two_d_classes, refined_volume]
        required: false
        description: 2D or 3D class optimiser JobResult to select from.
    params:
      auto_select_2d_classes:
        type: bool
        required: false
        default: false
        description: Whether to automatically select 2D classes with RELION class_ranker.
        exposure: user_overridable
