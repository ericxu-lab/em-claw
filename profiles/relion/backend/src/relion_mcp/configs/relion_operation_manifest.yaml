    - key: resmin
      gui_label: 'Minimum resolution (A):'
      option_type: number
      required_for_addjob: false
      default: 30
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: CTFFIND's ResMin parameter
      warnings: []
    - key: resmax
      gui_label: 'Maximum resolution (A):'
      option_type: number
      required_for_addjob: false
      default: 5
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: CTFFIND's ResMax parameter
      warnings: []
    - key: dfmin
      gui_label: 'Minimum defocus value (A):'
      option_type: number
      required_for_addjob: false
      default: 5000
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: CTFFIND's dFMin parameter
      warnings: []
    - key: dfmax
      gui_label: 'Maximum defocus value (A):'
      option_type: number
      required_for_addjob: false
      default: 50000
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: CTFFIND's dFMax parameter
      warnings: []
    - key: dfstep
      gui_label: 'Defocus step size (A):'
      option_type: number
      required_for_addjob: false
      default: 500
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: CTFFIND's FStep parameter
      warnings: []
    - key: localsearch_nominal_defocus
      gui_label: 'Nominal defocus search range (A) '
      option_type: number
      required_for_addjob: false
      default: 10000
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If a positive value is given, the defocus search range will be set to
        +/- this value (in A) around the nominal defocus value from the input STAR
        file. If a zero or negative value are given, then the overall min-max defocus
        search ranges above will be used instead.
      warnings: []
    - key: exp_factor_dose
      gui_label: 'Dose-dependent Thon ring fading (e/A^2) '
      option_type: number
      required_for_addjob: false
      default: 100
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If a positive value is given, then the maximum resolution for CTF estimation
        is lowerered by exp(dose/this_factor) times the original maximum resolution
        specified above. Remember that exp(1) ~=2.7, so a value of 100 e/A^2 for this
        factor will yield 2.7x higher maxres for an accumulated dose of 100 e/A^2;
        Smaller values will lead to faster decay of the maxres. If zero or a negative
        value is given, the maximum value specified above will be used for all images.
      warnings: []
    - key: ctf_win
      gui_label: 'Estimate CTF on window size (pix) '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If a positive value is given, a squared window of this size at the center
        of the micrograph will be used to estimate the CTF. This may be useful to
        exclude parts of the micrograph that are unsuitable for CTF estimation, e.g.
        the labels at the edge of phtographic film. The original micrograph will be
        used (i.e. this option will be ignored) if a negative value is given.
      warnings: []
