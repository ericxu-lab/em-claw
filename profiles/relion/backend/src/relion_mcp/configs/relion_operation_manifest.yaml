        coordinates in pixels of the tilt series, or rlnCenteredCoordinateX/Y/ZAngst
        column with coordinates in Angstroms from the center of the tomograms). ASCII
        files may contain headers, but all lines where the first 3 columns contain
        numbers will be interpreted as data lines. The first 3 columns are assumed
        to be X, Y and Z coordinates. If 6 columns are present, columns 4,5 and 6
        are assumed to be the rlnTomoSubtomogramRot/Tilt/Psi. For text files, the
        options below are used to indicate whether the coordinates are relative to
        the centre of the tomogram (in which case they need to be provided in Angstroms,
        or converted thereto using a pixel size). Or if the coordinates are decentered,
        they need to be provided in pixels of the tilt series, possibly using a multiplicative
        scaling factor.
