      input_node_type: LABEL_MICS_CPIPE
      file_pattern: STAR files (*.star)
      radio_choices: []
      help: A STAR file with all micrographs to run CTFFIND or Gctf on
      warnings: []
    - key: use_noDW
      gui_label: Use micrograph without dose-weighting?
      option_type: boolean
      required_for_addjob: false
      default: false
