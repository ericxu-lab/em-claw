      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Pixel size in Angstroms. This will be used to calculate the filters and
        the particle diameter in pixels. If a CTF-containing STAR file is input, then
        the value given here will be ignored, and the pixel size will be calculated
        from the values in the STAR file. A negative value can then be given here.
