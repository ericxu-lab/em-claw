        will be wiped. If the job crashes, you may want to remove it yourself.
      warnings: []
    - key: do_combine_thru_disc
      gui_label: Combine iterations through disc?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, at the end of every iteration all MPI followers will write
        out a large file with their accumulated results. The MPI leader will read
