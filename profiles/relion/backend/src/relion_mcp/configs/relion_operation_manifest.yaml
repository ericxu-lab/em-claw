      input_node_type: LABEL_PARTS_CPIPE
      file_pattern: STAR files (*.star) Image stacks (not recommended, read help!)
        (*.{spi,mrcs})
      radio_choices: []
      help: A STAR file with all images (and their metadata).
      warnings: []
    - key: fn_map
      gui_label: 'Consensus map:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MAP_CPIPE
      file_pattern: Image Files (*.{spi,vol,mrc})
      radio_choices: []
      help: A 3D map in MRC/Spider format. Make sure this map has the same dimensions
        and the same pixel size as your input images.
      warnings: []
    - key: fn_mask
      gui_label: 'Mask (optional):'
      option_type: filename
      required_for_addjob: false
      default: LABEL_MASK_CPIPE
      input_node_type: null
      file_pattern: ''
      radio_choices: []
      help: Provide a mask to limit deformations to a specific region of the consensus
        structure. Regions outside the mask will be kept fized and will not be visualised.
      warnings: []
    - key: gpu_id
      gui_label: 'Which (single) GPU to use:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Note that DynaMight can only use one GPU at a time. Data sets with many
        particles or large box sizes will require powerful GPUs, like an A100.
      warnings: []
    - key: do_preload
      gui_label: Preload images in RAM?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, dynamight will preload images into memory for learning
        the forward or inverse deformations and for deformed backprojection. This
        will speed up the calculations, but you need to make sure you have enough
        RAM to do so.
      warnings: []
    - key: fn_dynamight_exe
      gui_label: 'DynaMight executable:'
      option_type: string
      required_for_addjob: false
      default: relion_python_dynamight
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The DynaMight executable. By default, the relion_python_dynamight will
        be used, which was installed inside conda with a typical relion install. Only
        change this if that version is giving you problems.
      warnings: []
    - key: nr_gaussians
      gui_label: 'Number of Gaussians: '
      option_type: number
      required_for_addjob: false
      default: 10000
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of Gaussians to describe the consensus map with. Larger structures
        that one wishes to describe at higher resolutions will need more Gaussians.
        As a rule of thumb, you could try and use 1-2 Gaussians per amino acid or
        nucleotide in your complex. But note that running DynaMight with more than
        30,000 Gaussians may be problematic on GPUs with a memory of 24 GB.
      warnings: []
    - key: initial_threshold
      gui_label: 'Initial map threshold (optional): '
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If provided, this threshold will be used to position initial Gaussians
        in the consensus map. If left empty, an automated procedure will be used to
        estimate the appropriate threshold.
      warnings: []
    - key: reg_factor
      gui_label: 'Regularization factor: '
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This regularization factor defines the relative weights between the data
        over the restraints. Values higher than one will put more weights on the restraints.
      warnings: []
    - key: fn_checkpoint
      gui_label: 'Checkpoint file:'
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: Checkpoint files (*.pth)
      radio_choices: []
      help: Select the checkpoint file to use for visualization, inverse deformation
        estimation or deformed backprojection. If left empty, the last available checkpoint
        file will be used
