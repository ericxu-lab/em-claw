      gui_label: Min. diameter for LoG filter (A)
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The smallest allowed diameter for the blob-detection algorithm. This should
        correspond to the smallest size of your particles in Angstroms.
      warnings: []
    - key: log_diam_max
      gui_label: Max. diameter for LoG filter (A)
      option_type: number
      required_for_addjob: false
      default: 250
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The largest allowed diameter for the blob-detection algorithm. This should
        correspond to the largest size of your particles in Angstroms.
      warnings: []
