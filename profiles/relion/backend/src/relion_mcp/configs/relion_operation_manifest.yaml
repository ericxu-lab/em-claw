    relion_job_type: Reconstruct
    proc_constant: PROC_TOMO_RECONSTRUCT
    proc_label: relion.reconstructparticletomo
    dirname: Reconstruct
    initializer: initialiseTomoReconPartJob
    category: tomo
    support_level: manifest_only
    has_mpi: true
    has_threads: true
    neutral_operation_candidates: []
    options:
    - key: binning
      gui_label: 'Binning factor:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The tilt series images will be binned by this (real-valued) factor and
        then reconstructed in the specified box size above. Note that thereby the
        reconstructed region becomes larger when specifying binning factors larger
        than one.
      warnings: []
    - key: box_size
      gui_label: 'Box size (binned pix):'
      option_type: number
      required_for_addjob: false
      default: 128
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Box size of the reconstruction. Note that this is independent of the box
        size that has been used to refine the particle. This allows the user to construct
        a 3D map of arbitrary size to gain an overview of the structure surrounding
        the particle. A sufficiently large box size also allows more of the high-frequency
        signal to be captured that has been delocalised by the CTF.
      warnings: []
    - key: crop_size
      gui_label: 'Cropped box size (binned pix):'
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to a positive value, the program will output an additional set
        of maps that have been cropped to this size. This is useful if a map is desired
        that is smaller than the box size required to retrieve the CTF-delocalised
        signal.
      warnings: []
    - key: snr
      gui_label: 'Wiener SNR constant:'
      option_type: number
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to a positive value, apply a Wiener filter with this signal-to-noise
        ratio. If omitted, the reconstruction will use a heuristic to prevent divisions
        by excessively small numbers. Please note that using a low (even though realistic)
        SNR might wash out the higher frequencies, which could make the map unsuitable
        to be used for further refinement.
      warnings: []
    - key: sym_name
      gui_label: 'Symmetry:'
      option_type: string
      required_for_addjob: false
      default: C1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: "If the molecule is asymmetric, set Symmetry group to C1. Note their are\
        \ multiple possibilities for icosahedral symmetry: * I1: No-Crowther 222 (standard\
        \ in Heymann, Chagoyen & Belnap, JSB, 151 (2005) 196\xE2\x80\x93207) * I2:\
        \ Crowther 222 * I3: 52-setting (as used in SPIDER?) * I4: A different 52\
        \ setting The command 'relion_refine --sym D2 --print_symmetry_ops' prints\
        \ a list of all symmetry operators for symmetry group D2. RELION uses XMIPP's\
        \ libraries for symmetry operations. Therefore, look at the XMIPP Wiki for\
        \ more details: http://xmipp.cnb.csic.es/twiki/bin/view/Xmipp/WebHome?topic=Symmetry"
      warnings: []
    - key: do_helix
      gui_label: Apply helical symmetry?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then apply helical symmetry in Fourier space. Note that
        you may also want to apply helical symmetry in real-space, but that needs
        to be done from the command line, using the relion_helix_toolbox...
      warnings: []
    - key: helical_nr_asu
      gui_label: 'Number of unique asymmetrical units:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of unique helical asymmetrical units in each segment box. If the
        inter-box distance (set in segment picking step) is 100 Angstroms and the
        estimated helical rise is ~20 Angstroms, then set this value to 100 / 20 =
        5 (nearest integer). This integer should not be less than 1. The correct value
        is essential in measuring the signal to noise ratio in helical reconstruction.
      warnings: []
    - key: helical_twist
      gui_label: 'Helical twist (deg):'
      option_type: number
      required_for_addjob: false
      default: '-1.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set helical twist (in degrees) to positive value if it is a right-handed
        helix. Helical rise is a positive value in Angstroms.
      warnings: []
    - key: helical_rise
      gui_label: 'Helical rise (A):'
      option_type: number
      required_for_addjob: false
      default: 4.75
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set helical rise (in Amgstroms). This value is always positive
      warnings: []
    - key: helical_tube_outer_diameter
      gui_label: 'Outer helical diameter (A):'
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Outer diameter (in Angstroms) of the reconstructed helix. Real-space averaging
        will be performed within this diameter
      warnings: []
    - key: helical_z_percentage
      gui_label: 'Central Z length (%):'
      option_type: number
      required_for_addjob: false
      default: '20.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Reconstructed helix suffers from inaccuracies of orientation searches.
        The central part of the box contains more reliable information compared to
        the top and bottom parts along Z axis, where Fourier artefacts are also present
        if the number of helical asymmetrical units is larger than 1. Therefore, information
        from the central part of the box is used for searching and imposing helical
        symmetry in real space. Set this value (%) to the central part length along
        Z axis divided by the box size. Values around 30% are commonly used.
      warnings: []
