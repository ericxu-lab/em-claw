      input_node_type: LABEL_MASK_CPIPE
      file_pattern: Image Files (*.{spi,vol,msk,mrc})
      radio_choices: []
      help: Provide a soft mask where the protein density you wish to subtract from
        the experimental particles is black (0) and the density you wish to keep is
        white (1).
      warnings: []
    - key: do_data
      gui_label: Use different particles?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, subtraction will be performed on the particles in the STAR
        file below, instead of on all the particles of the 3D refinement/classification
        from the optimiser.star file.
