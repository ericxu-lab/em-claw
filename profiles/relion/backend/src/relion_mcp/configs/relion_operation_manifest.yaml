      gui_label: Are the particles white?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set this option to No if the particles are black, and to Yes if the particles
        are white.
      warnings: []
    - key: log_maxres
      gui_label: Maximum resolution to consider (A)
      option_type: number
      required_for_addjob: false
      default: 20
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The Laplacian-of-Gaussian filter will be applied to downscaled micrographs
        with the corresponding size. Give a negative value to skip downscaling.
      warnings: []
    - key: log_adjust_thr
      gui_label: 'Adjust default threshold (stddev):'
      option_type: number
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Use this to pick more (negative number -> lower threshold) or less (positive
        number -> higher threshold) particles compared to the default setting. The
        threshold is moved this many standard deviations away from the average.
      warnings: []
    - key: log_upper_thr
      gui_label: 'Upper threshold (stddev):'
      option_type: number
      required_for_addjob: false
      default: '999.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Use this to discard picks with LoG thresholds that are this many standard
        deviations above the average, e.g. to avoid high contrast contamination like
        ice and ethane droplets. Good values depend on the contrast of micrographs
        and need to be interactively explored; for low contrast micrographs, values
        of ~ 1.5 may be reasonable, but the same value will be too low for high-contrast
