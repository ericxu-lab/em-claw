relion_version_source:
  source: checked_in_source
  relion_version: '5.0'
  source_files:
  - docs/relion_source/relion_5_0/pipeline_jobs.h
  - docs/relion_source/relion_5_0/pipeline_jobs.cpp
  - docs/relion_source/relion_5_0/pipeliner.cpp
manifest_generation:
  extractor: scripts/extract_relion_operation_manifest.py
  strategy: source_derived_with_manual_support_level_overlay
job_types:
  Import:
    relion_job_type: Import
    proc_constant: PROC_IMPORT
    proc_label: relion.import
    dirname: Import
    initializer: initialiseImportJob
    category: spa
    support_level: schedule_mappable
    has_mpi: false
    has_threads: false
    neutral_operation_candidates:
    - import_particles
    options:
    - key: do_raw
      gui_label: Import raw movies/micrographs?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set this to Yes if you plan to import raw movies or micrographs
      warnings: []
    - key: fn_in_raw
      gui_label: 'Raw input files:'
      option_type: filename
      required_for_addjob: false
      default: Micrographs/*.tif
      input_node_type: null
      file_pattern: Movie or Image (*.{mrc,mrcs,tif,tiff,eer,mrc.bz2,mrcs.bz2,mrc.zst,mrcs.zst,mrc.xz,mrcs.xz})
      radio_choices: []
      help: Provide a Linux wildcard that selects all raw movies or micrographs to
        be imported. The path must be a relative path from the project directory.
        To import files outside the project directory, first make a symbolic link
        by an absolute path and then specify the link by a relative path. See the
        FAQ page on RELION wiki (https://www3.mrc-lmb.cam.ac.uk/relion/index.php/FAQs#What_is_the_right_way_to_import_files_outside_the_project_directory.3F)
        for details.To process compressed MRC movies, you need pbzip2, zstd and xz
        command in your PATH for bzip2, Zstandard and xzip compression, respectively.
      warnings: []
    - key: is_multiframe
      gui_label: Are these multi-frame movies?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes for multi-frame movies, set to No for single-frame micrographs.
      warnings: []
    - key: optics_group_name
      gui_label: 'Optics group name:'
      option_type: string
      required_for_addjob: false
      default: opticsGroup1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Name of this optics group. Each group of movies/micrographs with different
        optics characteristics for CTF refinement should have a unique name.
      warnings: []
    - key: fn_mtf
      gui_label: 'MTF of the detector:'
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: STAR Files (*.star)
      radio_choices: []
      help: As of release-3.1, the MTF of the detector is used in the refinement stages
        of refinement. If you know the MTF of your detector, provide it here. Curves
        for some well-known detectors may be downloaded from the RELION Wiki. Also
        see there for the exact format If you do not know the MTF of your detector
        and do not want to measure it, then by leaving this entry empty, you include
        the MTF of your detector in your overall estimated B-factor upon sharpening
        the map.Although that is probably slightly less accurate, the overall quality
        of your map will probably not suffer very much. Note that when combining data
        from different detectors, the differences between their MTFs can no longer
        be absorbed in a single B-factor, and providing the MTF here is important!
      warnings: []
    - key: angpix
      gui_label: 'Pixel size (Angstrom):'
      option_type: number
      required_for_addjob: false
      default: 1.4
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Pixel size in Angstroms.
      warnings: []
    - key: kV
      gui_label: 'Voltage (kV):'
      option_type: number
      required_for_addjob: false
      default: 300
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Voltage the microscope was operated on (in kV)
      warnings: []
    - key: Cs
      gui_label: 'Spherical aberration (mm):'
      option_type: number
      required_for_addjob: false
      default: 2.7
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Spherical aberration of the microscope used to collect these images (in
        mm). Typical values are 2.7 (FEI Titan & Talos, most JEOL CRYO-ARM), 2.0 (FEI
        Polara), 1.4 (some JEOL CRYO-ARM) and 0.01 (microscopes with a Cs corrector).
      warnings: []
    - key: Q0
      gui_label: 'Amplitude contrast:'
      option_type: number
      required_for_addjob: false
      default: 0.1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Fraction of amplitude contrast. Often values around 10% work better than
        theoretically more accurate lower values...
      warnings: []
    - key: beamtilt_x
      gui_label: 'Beamtilt in X (mrad):'
      option_type: number
      required_for_addjob: false
      default: 0.0
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Known beamtilt in the X-direction (in mrad). Set to zero if unknown.
      warnings: []
    - key: beamtilt_y
      gui_label: 'Beamtilt in Y (mrad):'
      option_type: number
      required_for_addjob: false
      default: 0.0
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Known beamtilt in the Y-direction (in mrad). Set to zero if unknown.
      warnings: []
    - key: do_other
      gui_label: Import other node types?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set this to Yes if you plan to import anything else than movies or micrographs
      warnings: []
    - key: fn_in_other
      gui_label: 'Input file:'
      option_type: filename
      required_for_addjob: false
      default: ref.mrc
      input_node_type: null
      file_pattern: Input file (*.*)
      radio_choices: []
      help: Select any file(s) to import. Note that for importing coordinate files,
        one has to give a Linux wildcard, where the *-symbol is before the coordinate-file
        suffix, e.g. if the micrographs are called mic1.mrc and the coordinate files
        mic1.box or mic1_autopick.star, one HAS to give '*.box' or '*_autopick.star',
        respectively. Also note that micrographs, movies and coordinate files all
        need to be in the same directory (with the same rootnames, e.g.mic1 in the
        example above) in order to be imported correctly. 3D masks or references can
        be imported from anywhere. Note that movie-particle STAR files cannot be imported
        from a previous version of RELION, as the way movies are handled has changed
        in RELION-2.0. For the import of a particle, 2D references or micrograph STAR
        file or of a 3D reference or mask, only a single file can be imported at a
        time. Note that due to a bug in a fltk library, you cannot import from directories
        that contain a substring of the current directory, e.g. dont important from
        /data/betagal if your current directory is called /data/betagal_r2. In this
        case, just change one of the directory names.
      warnings: []
    - key: node_type
      gui_label: 'Node type:'
      option_type: radio
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_nodetype_options
      help: Select the type of Node this is.
      warnings: []
    - key: optics_group_particles
      gui_label: 'Rename optics group for particles:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'Only for the import of a particles STAR file with a single, or no, optics
        groups defined: rename the optics group for the imported particles to this
        string.'
      warnings: []
    - &id001
      key: do_queue
      gui_label: Submit to queue?
      option_type: string
      required_for_addjob: false
      default: use_queue
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will be submit to a queue, otherwise the job will
        be executed locally. Note that only MPI jobs may be sent to a queue. The default
        can be set through the environment variable RELION_QUEUE_USE.
      warnings: []
      common: true
    - &id002
      key: queuename
      gui_label: 'Queue name: '
      option_type: string
      required_for_addjob: false
      default: std::string(default_queue)
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Name of the queue to which to submit the job. The default name can be
        set through the environment variable RELION_QUEUE_NAME.
      warnings: []
      common: true
    - &id003
      key: qsub
      gui_label: 'Queue submit command:'
      option_type: string
      required_for_addjob: false
      default: std::string(default_command)
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Name of the command used to submit scripts to the queue, e.g. qsub or
        bsub. Note that the person who installed RELION should have made a custom
        script for your cluster/queue setup. Check this is the case (or create your
        own script following the RELION Wiki) if you have trouble submitting jobs.
        The default command can be set through the environment variable RELION_QSUB_COMMAND.
      warnings: []
      common: true
    - &id004
      key: qsub_extra
      gui_label: qsub_extra
      option_type: string
      required_for_addjob: false
      default: std::string(extra_default)
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: ''
      warnings:
      - GUI label was dynamic; option key used as fallback.
      common: true
    - &id005
      key: qsubscript
      gui_label: 'Standard submission script:'
      option_type: filename
      required_for_addjob: false
      default: std::string(default_location)
      input_node_type: null
      file_pattern: Script Files (*.{csh,sh,bash,script})
      radio_choices: []
      help: ''
      warnings: []
      common: true
    - &id006
      key: min_dedicated
      gui_label: 'Minimum dedicated cores per node:'
      option_type: number
      required_for_addjob: false
      default: minimum_nr_dedicated
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum number of dedicated cores that need to be requested on each node.
        This is useful to force the queue to fill up entire nodes of a given size.
        The default can be set through the environment variable RELION_MINIMUM_DEDICATED.
      warnings: []
      common: true
    - &id007
      key: other_args
      gui_label: 'Additional arguments:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: In this box command-line arguments may be provided that are not generated
        by the GUI. This may be useful for testing developmental options and/or expert
        use of the program. To print a list of possible options, run the corresponding
        program from the command line without any arguments.
      warnings: []
      common: true
    expected_output_patterns:
    - result_type: imported_movies
      result_name: imported_movies
      path_pattern: '{job_dir}/movies.star'
      warnings:
      - Source-derived manifest augmented with conservative Import output pattern
        for tests.
    warnings: []
  MotionCorr:
    relion_job_type: MotionCorr
    proc_constant: PROC_MOTIONCORR
    proc_label: relion.motioncorr
    dirname: MotionCorr
    initializer: initialiseMotioncorrJob
    category: spa
    support_level: schedule_mappable
    has_mpi: true
    has_threads: true
    neutral_operation_candidates:
    - motion_correction
    options:
    - key: input_star_mics
      gui_label: 'Input tilt series: '
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_TOMOGRAMS_CPIPE
      file_pattern: Tilt series STAR file (*.star)
      radio_choices: []
      help: Input global tilt series star file
      warnings: []
    - key: input_star_mics
      gui_label: 'Input movies STAR file:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MOVIES_CPIPE
      file_pattern: STAR files (*.star)
      radio_choices: []
      help: A STAR file with all micrographs to run MOTIONCORR on
      warnings: []
    - key: first_frame_sum
      gui_label: 'First frame for corrected sum:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: First frame to use in corrected average (starts counting at 1).
      warnings: []
    - key: last_frame_sum
      gui_label: 'Last frame for corrected sum:'
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Last frame to use in corrected average. Values equal to or smaller than
        0 mean 'use all frames'.
      warnings: []
    - key: eer_grouping
      gui_label: 'EER fractionation:'
      option_type: number
      required_for_addjob: false
      default: 32
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The number of hardware frames to group into one fraction. This option
        is relevant only for Falcon4 movies in the EER format. Note that all 'frames'
        in the GUI (e.g. first and last frame for corrected sum, dose per frame) refer
        to fractions, not raw detector frames. See https://www3.mrc-lmb.cam.ac.uk/relion/index.php/Image_compression#Falcon4_EER
        for detailed guidance on EER processing.
      warnings: []
    - key: do_float16
      gui_label: Write output in float16?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, RelionCor2 will write output images in float16 MRC format.
        This will save a factor of two in disk space compared to the default of writing
        in float32. Note that RELION and CCPEM will read float16 images, but other
        programs may not (yet) do so. For example, Gctf will not work with float16
        images. Also note that this option does not work with UCSF MotionCor2. For
        CTF estimation, use CTFFIND-4.1 with pre-calculated power spectra (activate
        the 'Save sum of power spectra' option).
      warnings: []
    - key: do_even_odd_split
      gui_label: Save images for denoising?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, MotionCor2 will write output images summed from both the
        even frames of the input movie and the odd frames of the input movie. This
        generates two versions of the same movie which essential if you wish to carry
        out denoising later. If you are unsure whether you will need denoising later,
        it is best to select Yes, but be aware this option increases the processing
        time for MotionCor. At the moment, this is only available in Shawn Zheng's
        MotionCor2 (>=v1.3.0) and therefore do_float_16 must equal false too.
      warnings: []
    - key: bfactor
      gui_label: 'Bfactor:'
      option_type: number
      required_for_addjob: false
      default: 150
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The B-factor that will be applied to the micrographs.
      warnings: []
    - key: patch_x
      gui_label: 'Number of patches X:'
      option_type: string
      required_for_addjob: false
      default: '1'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of patches (in X and Y direction) to apply motioncor2.
      warnings: []
    - key: patch_y
      gui_label: 'Number of patches Y:'
      option_type: string
      required_for_addjob: false
      default: '1'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of patches (in X and Y direction) to apply motioncor2.
      warnings: []
    - key: group_frames
      gui_label: 'Group frames:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Average together this many frames before calculating the beam-induced
        shifts.
      warnings: []
    - key: bin_factor
      gui_label: 'Binning factor:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Bin the micrographs this much by a windowing operation in the Fourier
        Tranform. Binning at this level is hard to un-do later on, but may be useful
        to down-scale super-resolution images. Float-values may be used. Do make sure
        though that the resulting micrograph size is even.
      warnings: []
    - key: fn_gain_ref
      gui_label: 'Gain-reference image:'
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: '*.{mrc,gain}'
      radio_choices: []
      help: Location of the gain-reference file to be applied to the input micrographs.
        Leave this empty if the movies are already gain-corrected.
      warnings: []
    - key: gain_rot
      gui_label: 'Gain rotation:'
      option_type: radio
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_gain_rotation_options
      help: Rotate the gain reference by this number times 90 degrees clockwise in
        relion_display. This is the same as -RotGain in MotionCor2. Note that MotionCor2
        uses a different convention for rotation so it says 'counter-clockwise'. Valid
        values are 0, 1, 2 and 3.
      warnings: []
    - key: gain_flip
      gui_label: 'Gain flip:'
      option_type: radio
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_gain_flip_options
      help: Flip the gain reference after rotation. This is the same as -FlipGain
        in MotionCor2. 0 means do nothing, 1 means flip Y (upside down) and 2 means
        flip X (left to right).
      warnings: []
    - key: do_own_motioncor
      gui_label: Use RELION's own implementation?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, use RELION's own implementation of a MotionCor2-like algorithm
        by Takanori Nakane. Otherwise, wrap to the UCSF implementation. Note that
        Takanori's program only runs on CPUs but uses multiple threads, while the
        UCSF-implementation needs a GPU but uses only one CPU thread. Takanori's implementation
        is most efficient when the number of frames is divisible by the number of
        threads (e.g. 12 or 18 threads per MPI process for 36 frames). On some machines,
        setting the OMP_PROC_BIND environmental variable to TRUE accelerates the program.
        When running on 4k x 4k movies and using 6 to 12 threads, the speeds should
        be similar. Note that Takanori's program uses the same model as the UCSF program
        and gives results that are almost identical. Whichever program you use, 'Motion
        Refinement' is highly recommended to get the most of your dataset.
      warnings: []
    - key: fn_motioncor2_exe
      gui_label: 'MOTIONCOR2 executable:'
      option_type: filename
      required_for_addjob: false
      default: std::string(default_location)
      input_node_type: null
      file_pattern: '*.*'
      radio_choices: []
      help: Location of the MOTIONCOR2 executable. You can control the default of
        this field by setting environment variable RELION_MOTIONCOR2_EXECUTABLE, or
        by editing the first few lines in src/gui_jobwindow.h and recompile the code.
      warnings: []
    - key: fn_defect
      gui_label: 'Defect file:'
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: '*'
      radio_choices: []
      help: Location of a UCSF MotionCor2-style defect text file or a defect map that
        describe the defect pixels on the detector. Each line of a defect text file
        should contain four numbers specifying x, y, width and height of a defect
        region. A defect map is an image (MRC or TIFF), where 0 means good and 1 means
        bad pixels. The coordinate system is the same as the input movie before application
        of binning, rotation and/or flipping. Note that the format of the defect text
        is DIFFERENT from the defect text produced by SerialEM! One can convert a
        SerialEM-style defect file into a defect map using IMOD utilities e.g. "clip
        defect -D defect.txt -f tif movie.mrc defect_map.tif". See explanations in
        the SerialEM manual. Leave empty if you don't have any defects, or don't want
        to correct for defects on your detector.
      warnings: []
    - key: gpu_ids
      gui_label: 'Which GPUs to use:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Provide a list of which GPUs (0,1,2,3, etc) to use. MPI-processes are
        separated by ':'. For example, to place one rank on device 0 and one rank
        on device 1, provide '0:1'. Note that multiple MotionCor2 processes should
        not share a GPU; otherwise, it can lead to crash or broken outputs (e.g. black
        images) .
      warnings: []
    - key: other_motioncor2_args
      gui_label: Other MOTIONCOR2 arguments
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Additional arguments that need to be passed to MOTIONCOR2.
      warnings: []
    - key: do_dose_weighting
      gui_label: Do dose-weighting?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the averaged micrographs will be dose-weighted.
      warnings: []
    - key: do_save_noDW
      gui_label: Save non-dose weighted as well?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Aligned but non-dose weighted images are sometimes useful in CTF estimation,
        although there is no difference in most cases. Whichever the choice, CTF refinement
        job is always done on dose-weighted particles.
      warnings: []
    - key: dose_per_frame
      gui_label: 'Dose per frame (e/A2):'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Dose per movie frame (in electrons per squared Angstrom).
      warnings: []
    - key: pre_exposure
      gui_label: 'Pre-exposure (e/A2):'
      option_type: number
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Pre-exposure dose (in electrons per squared Angstrom).
      warnings: []
    - key: do_save_ps
      gui_label: Save sum of power spectra?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Sum of non-dose weighted power spectra provides better signal for CTF
        estimation. The power spectra can be used by CTFFIND4 but not by GCTF. This
        option is not available for UCSF MotionCor2. You must use this option when
        writing in float16.
      warnings: []
    - key: group_for_ps
      gui_label: 'Sum power spectra every e/A2:'
      option_type: number
      required_for_addjob: false
      default: 4
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: McMullan et al (Ultramicroscopy, 2015) suggest summing power spectra every
        4.0 e/A2 gives optimal Thon rings
      warnings: []
    - key: group_for_ps
      gui_label: 'Sum power spectra every n frames:'
      option_type: number
      required_for_addjob: false
      default: 4
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: McMullan et al (Ultramicroscopy, 2015) suggest summing power spectra every
        4.0 e/A2 gives optimal Thon rings
      warnings: []
    - &id008
      key: nr_mpi
      gui_label: 'Number of MPI procs:'
      option_type: number
      required_for_addjob: false
      default: qsub_nrmpi_val
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of MPI nodes to use in parallel. When set to 1, MPI will not be
        used. The maximum can be set through the environment variable RELION_MPI_MAX.
      warnings: []
      common: true
    - &id009
      key: nr_threads
      gui_label: 'Number of threads:'
      option_type: number
