        during motion correction. You must use this option if you used float16 in
        motion correction.
      warnings: []
    - key: fn_ctffind_exe
      gui_label: 'CTFFIND-4.1 executable:'
      option_type: filename
      required_for_addjob: false
      default: std::string(default_location)
      input_node_type: null
      file_pattern: '*'
      radio_choices: []
      help: Location of the CTFFIND (release 4.1 or later) executable. You can control
        the default of this field by setting environment variable RELION_CTFFIND_EXECUTABLE,
        or by editing the first few lines in src/gui_jobwindow.h and recompile the
        code.
      warnings: []
    - key: slow_search
      gui_label: Use exhaustive search?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, CTFFIND4 will use slower but more exhaustive search. This
        option is recommended for CTFFIND version 4.1.8 and earlier, but probably
        not necessary for 4.1.10 and later. It is also worth trying this option when
        astigmatism and/or phase shifts are difficult to fit.
      warnings: []
    - key: box
      gui_label: 'FFT box size (pix):'
      option_type: number
      required_for_addjob: false
      default: 512
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: CTFFIND's Box parameter
