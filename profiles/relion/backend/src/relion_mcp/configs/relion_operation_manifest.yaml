    - key: red_value
      gui_label: 'Red value: '
      option_type: number
      required_for_addjob: false
      default: '2.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The value of this entry will be red. There will be a linear scale from
        blue to red, according to this value and the one given above.
      warnings: []
