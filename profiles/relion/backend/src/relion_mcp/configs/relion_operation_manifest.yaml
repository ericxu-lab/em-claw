      file_pattern: STAR Files (*_optimiser.star)
      radio_choices: []
      help: Select the *_optimiser.star file for the iteration of the 3D refinement/classification
        which you want to use for subtraction. It will use the maps from this run
        for the subtraction, and of no particles input STAR file is given below, it
