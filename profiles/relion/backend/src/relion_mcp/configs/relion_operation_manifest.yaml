        run and the rootname of the previous run cannot be the same. If they are the
        same, the program will automatically add a '_ctX' to the output rootname,
        with X being the iteration from which one continues the previous run.
      warnings: []
    - key: fn_ref
      gui_label: 'Reference map:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MAP_CPIPE
      file_pattern: Image Files (*.{spi,vol,mrc})
      radio_choices: []
      help: A 3D map in MRC/Spider format. Make sure this map has the same dimensions
        and the same pixel size as your input images, or specify that one can resize
        the reference if needed.
      warnings: []
    - key: fn_mask
      gui_label: 'Reference mask (optional):'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MASK_CPIPE
      file_pattern: Image Files (*.{spi,vol,msk,mrc})
      radio_choices: []
      help: If no mask is provided, a soft spherical mask based on the particle diameter
        will be used. Otherwise, provide a Spider/mrc map containing a (soft) mask
        with the same dimensions as the reference(s), and values between 0 and 1,
        with 1 being 100% protein and 0 being 100% solvent. The reconstructed reference
        map will be multiplied by this mask. In some cases, for example for non-empty
        icosahedral viruses, it is also useful to use a second mask. For all white
        (value 1) pixels in this second mask the corresponding pixels in the reconstructed
        map are set to the average value of these pixels. Thereby, for example, the
        higher density inside the virion may be set to a constant. Note that this
        second mask should have one-values inside the virion and zero-values in the
        capsid and the solvent areas. To use a second mask, use the additional option
        --solvent_mask2, which may given in the Additional arguments line (in the
        Running tab).
      warnings: []
    - key: ref_correct_greyscale
      gui_label: Ref. map is on absolute greyscale?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'Probabilities are calculated based on a Gaussian noise model, which contains
        a squared difference term between the reference and the experimental image.
        This has a consequence that the reference needs to be on the same absolute
        intensity grey-scale as the experimental images. RELION and XMIPP reconstruct
        maps at their absolute intensity grey-scale. Other packages may perform internal
        normalisations of the reference density, which will result in incorrect grey-scales.
        Therefore: if the map was reconstructed in RELION or in XMIPP, set this option
        to Yes, otherwise set it to No. If set to No, RELION will use a (grey-scale
        invariant) cross-correlation criterion in the first iteration, and prior to
        the second iteration the map will be filtered again using the initial low-pass
        filter. This procedure is relatively quick and typically does not negatively
        affect the outcome of the subsequent MAP refinement. Therefore, if in doubt
        it is recommended to set this option to No.'
      warnings: []
    - key: trust_ref_size
      gui_label: Resize reference if needed?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If true, and if the input reference map (and mask) do not have the same
        pixel size and/or box size, then they will be re-scaled and re-boxed accordingly.
        If this option is set to false, then the program will die with an error if
        the reference does not have the correct pixel and/or box size.
      warnings: []
    - key: ini_high
      gui_label: 'Initial low-pass filter (A):'
      option_type: number
      required_for_addjob: false
      default: 60
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: It is recommended to strongly low-pass filter your initial reference map.
        If it has not yet been low-pass filtered, it may be done internally using
        this option. If set to 0, no low-pass filter will be applied to the initial
        reference(s).
      warnings: []
    - key: sym_name
      gui_label: 'Symmetry:'
      option_type: string
      required_for_addjob: false
      default: C1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: "If the molecule is asymmetric, set Symmetry group to C1. Note their are\
        \ multiple possibilities for icosahedral symmetry: * I1: No-Crowther 222 (standard\
        \ in Heymann, Chagoyen & Belnap, JSB, 151 (2005) 196\xE2\x80\x93207) * I2:\
        \ Crowther 222 * I3: 52-setting (as used in SPIDER?) * I4: A different 52\
        \ setting The command 'relion_refine --sym D2 --print_symmetry_ops' prints\
        \ a list of all symmetry operators for symmetry group D2. RELION uses XMIPP's\
        \ libraries for symmetry operations. Therefore, look at the XMIPP Wiki for\
        \ more details: http://xmipp.cnb.csic.es/twiki/bin/view/Xmipp/WebHome?topic=Symmetry"
      warnings: []
    - key: do_ctf_correction
      gui_label: Do CTF-correction?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, CTFs will be corrected inside the MAP refinement. The resulting
        algorithm intrinsically implements the optimal linear, or Wiener filter. Note
        that CTF parameters for all images need to be given in the input STAR file.
        The command 'relion_refine --print_metadata_labels' will print a list of all
        possible metadata labels for that STAR file. See the RELION Wiki for more
        details. Also make sure that the correct pixel size (in Angstrom) is given
        above!)
      warnings: []
    - key: ctf_intact_first_peak
      gui_label: Ignore CTFs until first peak?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'If set to Yes, then CTF-amplitude correction will only be performed from
        the first peak of each CTF onward. This can be useful if the CTF model is
        inadequate at the lowest resolution. Still, in general using higher amplitude
        contrast on the CTFs (e.g. 10-20%) often yields better results. Therefore,
        this option is not generally recommended: try increasing amplitude contrast
        (in your input STAR file) first!'
      warnings: []
    - key: nr_classes
      gui_label: 'Number of classes:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The number of classes (K) for a multi-reference refinement. These classes
        will be made in an unsupervised manner from a single reference by division
        of the data into random subsets during the first iteration.
      warnings: []
    - key: tau_fudge
      gui_label: 'Regularisation parameter T:'
      option_type: number
      required_for_addjob: false
      default: default_T
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Bayes law strictly determines the relative weight between the contribution
        of the experimental data and the prior. However, in practice one may need
        to adjust this weight to put slightly more weight on the experimental data
        to allow optimal results. Values greater than 1 for this regularisation parameter
        (T in the JMB2011 paper) put more weight on the experimental data. Values
        around 2-4 have been observed to be useful for 3D refinements, values of 1-2
        for 2D refinements. Too small values yield too-low resolution structures;
        too high values result in over-estimated resolutions, mostly notable by the
        apparition of high-frequency noise in the references.
      warnings: []
    - key: nr_iter
      gui_label: 'Number of iterations:'
      option_type: number
      required_for_addjob: false
      default: 25
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of iterations to be performed. Note that the current implementation
        of 2D class averaging and 3D classification does NOT comprise a convergence
        criterium. Therefore, the calculations will need to be stopped by the user
        if further iterations do not yield improvements in resolution or classes.
        Also note that upon restarting, the iteration number continues to be increased,
        starting from the final iteration in the previous run. The number given here
        is the TOTAL number of iterations. For example, if 10 iterations have been
        performed previously and one restarts to perform an additional 5 iterations
        (for example with a finer angular sampling), then the number given here should
        be 10+5=15.
      warnings: []
    - key: do_fast_subsets
      gui_label: Use fast subsets (for large data sets)?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: ''
      warnings: []
    - key: particle_diameter
      gui_label: 'Mask diameter (A):'
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The experimental images will be masked with a soft circular mask with
        this diameter. Make sure this radius is not set too small because that may
        mask away part of the signal! If set to a value larger than the image size
        no masking will be performed. The same diameter will also be used for a spherical
        mask of the reference structures if no user-provided mask is specified.
      warnings: []
    - key: do_zero_mask
      gui_label: Mask individual particles with zeros?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then in the individual particles, the area outside a circle
        with the radius of the particle will be set to zeros prior to taking the Fourier
        transform. This will remove noise and therefore increase sensitivity in the
        alignment and classification. However, it will also introduce correlations
        between the Fourier components that are not modelled. When set to No, then
        the solvent area is filled with random noise, which prevents introducing correlations.High-resolution
        refinements (e.g. ribosomes or other large complexes in 3D auto-refine) tend
        to work better when filling the solvent area with random noise (i.e. setting
        this option to No), refinements of smaller complexes and most classifications
        go better when using zeros (i.e. setting this option to Yes).
      warnings: []
    - key: highres_limit
      gui_label: 'Limit resolution E-step to (A): '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to a positive number, then the expectation step (i.e. the alignment)
        will be done only including the Fourier components up to this resolution (in
        Angstroms). This is useful to prevent overfitting, as the classification runs
        in RELION are not to be guaranteed to be 100% overfitting-free (unlike the
        3D auto-refine with its gold-standard FSC). In particular for very difficult
        data sets, e.g. of very small or featureless particles, this has been shown
        to give much better class averages. In such cases, values in the range of
        7-12 Angstroms have proven useful.
      warnings: []
    - key: do_blush
      gui_label: Use Blush regularisation?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, relion_refine will use a neural network to perform regularisation
        by denoising at every iteration, instead of the standard smoothness regularisation.
      warnings: []
    - key: dont_skip_align
      gui_label: Perform image alignment?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to No, then rather than performing both alignment and classification,
        only classification will be performed. This allows the use of very focused
        masks.This requires that the optimal orientations of all particles are already
        stored in the input STAR file.
      warnings: []
    - key: sampling
      gui_label: 'Angular sampling interval:'
      option_type: radio
      required_for_addjob: false
      default: 2
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_sampling_options
      help: There are only a few discrete angular samplings possible because we use
        the HealPix library to generate the sampling of the first two Euler angles
        on the sphere. The samplings are approximate numbers and vary slightly over
        the sphere. If auto-sampling is used, this will be the value for the first
        iteration(s) only, and the sampling rate will be increased automatically after
        that.
      warnings: []
    - key: offset_range
      gui_label: 'Offset search range (pix):'
      option_type: number
      required_for_addjob: false
      default: 5
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Probabilities will be calculated only for translations in a circle with
        this radius (in pixels). The center of this circle changes at every iteration
        and is placed at the optimal translation for each image in the previous iteration.
        If auto-sampling is used, this will be the value for the first iteration(s)
        only, and the sampling rate will be increased automatically after that.
      warnings: []
    - key: offset_step
      gui_label: 'Offset search step (pix):'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Translations will be sampled with this step-size (in pixels).Translational
        sampling is also done using the adaptive approach. Therefore, if adaptive=1,
        the translations will first be evaluated on a 2x coarser grid. If auto-sampling
        is used, this will be the value for the first iteration(s) only, and the sampling
        rate will be increased automatically after that.
      warnings: []
    - key: do_local_ang_searches
      gui_label: Perform local angular searches?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then rather than performing exhaustive angular searches,
        local searches within the range given below will be performed. A prior Gaussian
        distribution centered at the optimal orientation in the previous iteration
        and with a stddev of 1/3 of the range given below will be enforced.
      warnings: []
    - key: sigma_angles
      gui_label: 'Local angular search range:'
      option_type: number
      required_for_addjob: false
      default: '5.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local angular searches will be performed within +/- the given amount (in
        degrees) from the optimal orientation in the previous iteration. A Gaussian
        prior (also see previous option) will be applied, so that orientations closer
        to the optimal orientation in the previous iteration will get higher weights
        than those further away.
      warnings: []
    - key: allow_coarser
      gui_label: Allow coarser sampling?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the program will use coarser angular and translational
        samplings if the estimated accuracies of the assignments is still low in the
        earlier iterations. This may speed up the calculations.
      warnings: []
    - key: relax_sym
      gui_label: 'Relax symmetry:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: With this option, poses related to the standard local angular search range
        by the given point group will also be explored. For example, if you have a
        pseudo-symmetric dimer A-A', refinement or classification in C1 with symmetry
        relaxation by C2 might be able to improve distinction between A and A'. Note
        that the reference must be more-or-less aligned to the convention of (pseudo-)symmetry
        operators. For details, see Ilca et al 2019 and Abrishami et al 2020 cited
        in the About dialog.
      warnings: []
    - key: sigma_tilt
      gui_label: 'Prior width on tilt angle (deg):'
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'The width of the prior on the tilt angle: angular searches will be +/-3
        times this value. Tilt priors will be defined when particles have been picked
        as filaments, on spheres or on manifolds. Setting this width to a negative
        value will lead to no prior being used on the tilt angle.'
      warnings: []
    - key: do_helix
      gui_label: Do helical reconstruction?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then perform 3D helical reconstruction.
      warnings: []
    - key: helical_tube_inner_diameter
      gui_label: 'Tube diameter - inner (A):'
      option_type: string
      required_for_addjob: false
      default: '-1'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Inner and outer diameter (in Angstroms) of the reconstructed helix spanning
        across Z axis. Set the inner diameter to negative value if the helix is not
        hollow in the center. The outer diameter should be slightly larger than the
        actual width of helical tubes because it also decides the shape of 2D particle
        mask for each segment. If the psi priors of the extracted segments are not
        accurate enough due to high noise level or flexibility of the structure, then
        set the outer diameter to a large value.
      warnings: []
    - key: helical_tube_outer_diameter
      gui_label: 'Tube diameter - outer (A):'
      option_type: string
      required_for_addjob: false
      default: '-1'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Inner and outer diameter (in Angstroms) of the reconstructed helix spanning
        across Z axis. Set the inner diameter to negative value if the helix is not
        hollow in the center. The outer diameter should be slightly larger than the
        actual width of helical tubes because it also decides the shape of 2D particle
        mask for each segment. If the psi priors of the extracted segments are not
        accurate enough due to high noise level or flexibility of the structure, then
        set the outer diameter to a large value.
      warnings: []
    - key: range_rot
      gui_label: 'Angular search range - rot (deg):'
      option_type: string
      required_for_addjob: false
      default: '-1'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local angular searches will be performed within +/- of the given amount
        (in degrees) from the optimal orientation in the previous iteration. The default
        negative value means that no local searches will be performed. A Gaussian
        prior will be applied, so that orientations closer to the optimal orientation
        in the previous iteration will get higher weights than those further away.
        These ranges will only be applied to the rot, tilt and psi angles in the first
        few iterations (global searches for orientations) in 3D helical reconstruction.
        Values of 9 or 15 degrees are commonly used. Higher values are recommended
        for more flexible structures and more memory and computation time will be
        used. A range of 15 degrees means sigma = 5 degrees. These options will be
        invalid if you choose to perform local angular searches or not to perform
        image alignment on 'Sampling' tab.
      warnings: []
    - key: range_tilt
      gui_label: 'Angular search range - tilt (deg):'
      option_type: string
      required_for_addjob: false
      default: '15'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local angular searches will be performed within +/- the given amount (in
        degrees) from the optimal orientation in the previous iteration. A Gaussian
        prior (also see previous option) will be applied, so that orientations closer
        to the optimal orientation in the previous iteration will get higher weights
        than those further away. These ranges will only be applied to the rot, tilt
        and psi angles in the first few iterations (global searches for orientations)
        in 3D helical reconstruction. Values of 9 or 15 degrees are commonly used.
        Higher values are recommended for more flexible structures and more memory
        and computation time will be used. A range of 15 degrees means sigma = 5 degrees.
        These options will be invalid if you choose to perform local angular searches
        or not to perform image alignment on 'Sampling' tab.
      warnings: []
    - key: range_psi
      gui_label: 'Angular search range - psi (deg):'
      option_type: string
      required_for_addjob: false
      default: '10'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local angular searches will be performed within +/- the given amount (in
        degrees) from the optimal orientation in the previous iteration. A Gaussian
        prior (also see previous option) will be applied, so that orientations closer
        to the optimal orientation in the previous iteration will get higher weights
        than those further away. These ranges will only be applied to the rot, tilt
        and psi angles in the first few iterations (global searches for orientations)
        in 3D helical reconstruction. Values of 9 or 15 degrees are commonly used.
        Higher values are recommended for more flexible structures and more memory
        and computation time will be used. A range of 15 degrees means sigma = 5 degrees.
        These options will be invalid if you choose to perform local angular searches
        or not to perform image alignment on 'Sampling' tab.
      warnings: []
    - key: do_apply_helical_symmetry
      gui_label: Apply helical symmetry?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, helical symmetry will be applied in every iteration. Set
        to No if you have just started a project, helical symmetry is unknown or not
        yet estimated.
      warnings: []
    - key: helical_nr_asu
      gui_label: 'Number of unique asymmetrical units:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of unique helical asymmetrical units in each segment box. If the
        inter-box distance (set in segment picking step) is 100 Angstroms and the
        estimated helical rise is ~20 Angstroms, then set this value to 100 / 20 =
        5 (nearest integer). This integer should not be less than 1. The correct value
        is essential in measuring the signal to noise ratio in helical reconstruction.
      warnings: []
    - key: helical_twist_initial
      gui_label: 'Initial helical twist (deg):'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Initial helical symmetry. Set helical twist (in degrees) to positive value
        if it is a right-handed helix. Helical rise is a positive value in Angstroms.
        If local searches of helical symmetry are planned, initial values of helical
        twist and rise should be within their respective ranges.
      warnings: []
    - key: helical_rise_initial
      gui_label: 'Initial helical rise (A):'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Initial helical symmetry. Set helical twist (in degrees) to positive value
        if it is a right-handed helix. Helical rise is a positive value in Angstroms.
        If local searches of helical symmetry are planned, initial values of helical
        twist and rise should be within their respective ranges.
      warnings: []
    - key: helical_z_percentage
      gui_label: 'Central Z length (%):'
      option_type: number
      required_for_addjob: false
      default: '30.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Reconstructed helix suffers from inaccuracies of orientation searches.
        The central part of the box contains more reliable information compared to
        the top and bottom parts along Z axis, where Fourier artefacts are also present
        if the number of helical asymmetrical units is larger than 1. Therefore, information
        from the central part of the box is used for searching and imposing helical
        symmetry in real space. Set this value (%) to the central part length along
        Z axis divided by the box size. Values around 30% are commonly used.
      warnings: []
    - key: do_local_search_helical_symmetry
      gui_label: Do local searches of symmetry?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then perform local searches of helical twist and rise within
        given ranges.
      warnings: []
    - key: helical_twist_min
      gui_label: 'Helical twist search (deg) - Min:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical twist search. Set helical
        twist (in degrees) to positive value if it is a right-handed helix. Generally
        it is not necessary for the user to provide an initial step (less than 1 degree,
        5~1000 samplings as default). But it needs to be set manually if the default
        value does not guarantee convergence. The program cannot find a reasonable
        symmetry if the true helical parameters fall out of the given ranges. Note
        that the final reconstruction can still converge if wrong helical and point
        group symmetry are provided.
      warnings: []
    - key: helical_twist_max
      gui_label: 'Helical twist search (deg) - Max:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical twist search. Set helical
        twist (in degrees) to positive value if it is a right-handed helix. Generally
        it is not necessary for the user to provide an initial step (less than 1 degree,
        5~1000 samplings as default). But it needs to be set manually if the default
        value does not guarantee convergence. The program cannot find a reasonable
        symmetry if the true helical parameters fall out of the given ranges. Note
        that the final reconstruction can still converge if wrong helical and point
        group symmetry are provided.
      warnings: []
    - key: helical_twist_inistep
      gui_label: 'Helical twist search (deg) - Step:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical twist search. Set helical
        twist (in degrees) to positive value if it is a right-handed helix. Generally
        it is not necessary for the user to provide an initial step (less than 1 degree,
        5~1000 samplings as default). But it needs to be set manually if the default
        value does not guarantee convergence. The program cannot find a reasonable
        symmetry if the true helical parameters fall out of the given ranges. Note
        that the final reconstruction can still converge if wrong helical and point
        group symmetry are provided.
      warnings: []
    - key: helical_rise_min
      gui_label: 'Helical rise search (A) - Min:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical rise search. Helical rise
        is a positive value in Angstroms. Generally it is not necessary for the user
        to provide an initial step (less than 1% the initial helical rise, 5~1000
        samplings as default). But it needs to be set manually if the default value
        does not guarantee convergence. The program cannot find a reasonable symmetry
        if the true helical parameters fall out of the given ranges. Note that the
        final reconstruction can still converge if wrong helical and point group symmetry
        are provided.
      warnings: []
    - key: helical_rise_max
      gui_label: 'Helical rise search (A) - Max:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical rise search. Helical rise
        is a positive value in Angstroms. Generally it is not necessary for the user
        to provide an initial step (less than 1% the initial helical rise, 5~1000
        samplings as default). But it needs to be set manually if the default value
        does not guarantee convergence. The program cannot find a reasonable symmetry
        if the true helical parameters fall out of the given ranges. Note that the
        final reconstruction can still converge if wrong helical and point group symmetry
        are provided.
      warnings: []
    - key: helical_rise_inistep
      gui_label: 'Helical rise search (A) - Step:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical rise search. Helical rise
        is a positive value in Angstroms. Generally it is not necessary for the user
        to provide an initial step (less than 1% the initial helical rise, 5~1000
        samplings as default). But it needs to be set manually if the default value
        does not guarantee convergence. The program cannot find a reasonable symmetry
        if the true helical parameters fall out of the given ranges. Note that the
        final reconstruction can still converge if wrong helical and point group symmetry
        are provided.
      warnings: []
    - key: helical_range_distance
      gui_label: 'Range factor of local averaging:'
      option_type: number
      required_for_addjob: false
      default: '-1.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local averaging of orientations and translations will be performed within
        a range of +/- this value * the box size. Polarities are also set to be the
        same for segments coming from the same tube during local refinement. Values
        of ~ 2.0 are recommended for flexible structures such as MAVS-CARD filaments,
        ParM, MamK, etc. This option might not improve the reconstructions of helices
        formed from curled 2D lattices (TMV and VipA/VipB). Set to negative to disable
        this option.
      warnings: []
    - key: keep_tilt_prior_fixed
      gui_label: 'Keep tilt-prior fixed:'
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to yes, the tilt prior will not change during the optimisation.
        If set to No, at each iteration the tilt prior will move to the optimal tilt
        value for that segment from the previous iteration.
      warnings: []
    - key: do_parallel_discio
      gui_label: Use parallel disc I/O?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, all MPI followers will read their own images from disc.
        Otherwise, only the leader will read images and send them through the network
        to the followers. Parallel file systems like gluster of fhgfs are good at
        parallel disc I/O. NFS may break with many followers reading in parallel.
        If your datasets contain particles with different box sizes, you have to say
        Yes.
      warnings: []
    - key: nr_pool
      gui_label: 'Number of pooled particles:'
      option_type: number
      required_for_addjob: false
      default: 3
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Particles are processed in individual batches by MPI followers. During
        each batch, a stack of particle images is only opened and closed once to improve
        disk access times. All particle images of a single batch are read into memory
        together. The size of these batches is at least one particle per thread used.
        The nr_pooled_particles parameter controls how many particles are read together
        for each thread. If it is set to 3 and one uses 8 threads, batches of 3x8=24
        particles will be read together. This may improve performance on systems where
        disk access, and particularly metadata handling of disk access, is a problem.
        It has a modest cost of increased RAM usage.
      warnings: []
    - key: do_pad1
      gui_label: Skip padding?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the calculations will not use padding in Fourier space
        for better interpolation in the references. Otherwise, references are padded
        2x before Fourier transforms are calculated. Skipping padding (i.e. use --pad
        1) gives nearly as good results as using --pad 2, but some artifacts may appear
        in the corners from signal that is folded back.
      warnings: []
    - key: do_preread_images
      gui_label: Pre-read all particles into RAM?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, all particle images will be read into computer memory,
        which will greatly speed up calculations on systems with slow disk access.
        However, one should of course be careful with the amount of RAM available.
        Because particles are read in float-precision, it will take ( N * box_size
        * box_size * 4 / (1024 * 1024 * 1024) ) Giga-bytes to read N particles into
        RAM. For 100 thousand 200x200 images, that becomes 15Gb, or 60 Gb for the
        same number of 400x400 particles. Remember that running a single MPI follower
        on each node that runs as many threads as available cores will have access
        to all available RAM. If parallel disc I/O is set to No, then only the leader
        reads all particles into RAM and sends those particles through the network
        to the MPI followers during the refinement iterations.
      warnings: []
    - key: scratch_dir
      gui_label: 'Copy particles to scratch directory:'
      option_type: string
      required_for_addjob: false
      default: std::string(default_scratch)
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If a directory is provided here, then the job will create a sub-directory
        in it called relion_volatile. If that relion_volatile directory already exists,
        it will be wiped. Then, the program will copy all input particles into a large
        stack inside the relion_volatile subdirectory. Provided this directory is
        on a fast local drive (e.g. an SSD drive), processing in all the iterations
        will be faster. If the job finishes correctly, the relion_volatile directory
        will be wiped. If the job crashes, you may want to remove it yourself.
      warnings: []
    - key: do_combine_thru_disc
      gui_label: Combine iterations through disc?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, at the end of every iteration all MPI followers will write
        out a large file with their accumulated results. The MPI leader will read
        in all these files, combine them all, and write out a new file with the combined
        results. All MPI salves will then read in the combined results. This reduces
        heavy load on the network, but increases load on the disc I/O. This will affect
        the time it takes between the progress-bar in the expectation step reaching
        its end (the mouse gets to the cheese) and the start of the ensuing maximisation
        step. It will depend on your system setup which is most efficient.
      warnings: []
    - key: use_gpu
      gui_label: Use GPU acceleration?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will try to use GPU acceleration.
      warnings: []
    - key: gpu_ids
      gui_label: 'Which GPUs to use:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'This argument is not necessary. If left empty, the job itself will try
        to allocate available GPU resources. You can override the default allocation
        by providing a list of which GPUs (0,1,2,3, etc) to use. MPI-processes are
        separated by '':'', threads by '',''. For example: ''0,0:1,1:0,0:1,1'''
      warnings: []
    - *id008
    - *id009
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: classified_particles
      result_name: class3d_particles
      path_pattern: '{job_dir}/run_it*_data.star'
      warnings:
      - Source-derived manifest augmented with conservative Class3D particle STAR
        output pattern for adoption.
    - result_type: refined_volume
      result_name: class3d_class_volume
      path_pattern: '{job_dir}/run_it*_class*.mrc'
      warnings:
      - Source-derived manifest augmented with conservative Class3D class map output
        pattern for adoption.
    warnings: []
  Refine3D:
    relion_job_type: Refine3D
    proc_constant: PROC_3DAUTO
    proc_label: relion.refine3d
    dirname: Refine3D
    initializer: initialiseAutorefineJob
    category: spa
    support_level: schedule_mappable
    has_mpi: true
    has_threads: true
    neutral_operation_candidates:
    - final_refinement
    options:
    - key: fn_img
      gui_label: 'Input images STAR file:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_PARTS_CPIPE
      file_pattern: STAR files (*.star)
      radio_choices: []
      help: A STAR file with all images (and their metadata).
      warnings: []
    - key: fn_cont
      gui_label: 'Continue from here: '
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: STAR Files (*_it*_optimiser.star)
      radio_choices: []
      help: Select the *_optimiser.star file for the iteration from which you want
        to continue a previous run. Note that the Output rootname of the continued
        run and the rootname of the previous run cannot be the same. If they are the
        same, the program will automatically add a '_ctX' to the output rootname,
        with X being the iteration from which one continues the previous run.
      warnings: []
    - key: fn_ref
      gui_label: 'Reference map:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MAP_CPIPE
      file_pattern: Image Files (*.{spi,vol,mrc})
      radio_choices: []
      help: A 3D map in MRC/Spider format. Make sure this map has the same dimensions
        and the same pixel size as your input images, or specify that one can resize
        the reference if needed.
      warnings: []
    - key: fn_mask
      gui_label: 'Reference mask (optional):'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MASK_CPIPE
      file_pattern: Image Files (*.{spi,vol,msk,mrc})
      radio_choices: []
      help: If no mask is provided, a soft spherical mask based on the particle diameter
        will be used. Otherwise, provide a Spider/mrc map containing a (soft) mask
        with the same dimensions as the reference(s), and values between 0 and 1,
        with 1 being 100% protein and 0 being 100% solvent. The reconstructed reference
        map will be multiplied by this mask. In some cases, for example for non-empty
        icosahedral viruses, it is also useful to use a second mask. For all white
        (value 1) pixels in this second mask the corresponding pixels in the reconstructed
        map are set to the average value of these pixels. Thereby, for example, the
        higher density inside the virion may be set to a constant. Note that this
        second mask should have one-values inside the virion and zero-values in the
        capsid and the solvent areas. To use a second mask, use the additional option
        --solvent_mask2, which may given in the Additional arguments line (in the
        Running tab).
      warnings: []
    - key: ref_correct_greyscale
      gui_label: Ref. map is on absolute greyscale?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'Probabilities are calculated based on a Gaussian noise model, which contains
        a squared difference term between the reference and the experimental image.
        This has a consequence that the reference needs to be on the same absolute
        intensity grey-scale as the experimental images. RELION and XMIPP reconstruct
        maps at their absolute intensity grey-scale. Other packages may perform internal
        normalisations of the reference density, which will result in incorrect grey-scales.
        Therefore: if the map was reconstructed in RELION or in XMIPP, set this option
        to Yes, otherwise set it to No. If set to No, RELION will use a (grey-scale
        invariant) cross-correlation criterion in the first iteration, and prior to
        the second iteration the map will be filtered again using the initial low-pass
        filter. This procedure is relatively quick and typically does not negatively
        affect the outcome of the subsequent MAP refinement. Therefore, if in doubt
        it is recommended to set this option to No.'
      warnings: []
    - key: trust_ref_size
      gui_label: Resize reference if needed?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If true, and if the input reference map (and mask) do not have the same
        pixel size and/or box size, then they will be re-scaled and re-boxed accordingly.
        If this option is set to false, then the program will die with an error if
        the reference does not have the correct pixel and/or box size.
      warnings: []
    - key: ini_high
      gui_label: 'Initial low-pass filter (A):'
      option_type: number
      required_for_addjob: false
      default: 60
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: It is recommended to strongly low-pass filter your initial reference map.
        If it has not yet been low-pass filtered, it may be done internally using
        this option. If set to 0, no low-pass filter will be applied to the initial
        reference(s).
      warnings: []
    - key: sym_name
      gui_label: 'Symmetry:'
      option_type: string
      required_for_addjob: false
      default: C1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: "If the molecule is asymmetric, set Symmetry group to C1. Note their are\
        \ multiple possibilities for icosahedral symmetry: * I1: No-Crowther 222 (standard\
        \ in Heymann, Chagoyen & Belnap, JSB, 151 (2005) 196\xE2\x80\x93207) * I2:\
        \ Crowther 222 * I3: 52-setting (as used in SPIDER?) * I4: A different 52\
        \ setting The command 'relion_refine --sym D2 --print_symmetry_ops' prints\
        \ a list of all symmetry operators for symmetry group D2. RELION uses XMIPP's\
        \ libraries for symmetry operations. Therefore, look at the XMIPP Wiki for\
        \ more details: http://xmipp.cnb.csic.es/twiki/bin/view/Xmipp/WebHome?topic=Symmetry"
      warnings: []
    - key: do_ctf_correction
      gui_label: Do CTF-correction?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, CTFs will be applied to the projections of the map. This
        requires that CTF information is present in the input STAR file.
      warnings: []
    - key: ctf_intact_first_peak
      gui_label: Ignore CTFs until first peak?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'If set to Yes, then CTF-amplitude correction will only be performed from
        the first peak of each CTF onward. This can be useful if the CTF model is
        inadequate at the lowest resolution. Still, in general using higher amplitude
        contrast on the CTFs (e.g. 10-20%) often yields better results. Therefore,
        this option is not generally recommended: try increasing amplitude contrast
        (in your input STAR file) first!'
      warnings: []
    - key: particle_diameter
      gui_label: 'Mask diameter (A):'
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The experimental images will be masked with a soft circular mask with
        this diameter. Make sure this radius is not set too small because that may
        mask away part of the signal! If set to a value larger than the image size
        no masking will be performed. The same diameter will also be used for a spherical
        mask of the reference structures if no user-provided mask is specified.
      warnings: []
    - key: do_zero_mask
      gui_label: Mask individual particles with zeros?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then in the individual particles, the area outside a circle
        with the radius of the particle will be set to zeros prior to taking the Fourier
        transform. This will remove noise and therefore increase sensitivity in the
        alignment and classification. However, it will also introduce correlations
        between the Fourier components that are not modelled. When set to No, then
        the solvent area is filled with random noise, which prevents introducing correlations.High-resolution
        refinements (e.g. ribosomes or other large complexes in 3D auto-refine) tend
        to work better when filling the solvent area with random noise (i.e. setting
        this option to No), refinements of smaller complexes and most classifications
        go better when using zeros (i.e. setting this option to Yes).
      warnings: []
    - key: do_solvent_fsc
      gui_label: Use solvent-flattened FSCs?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then instead of using unmasked maps to calculate the gold-standard
        FSCs during refinement, masked half-maps are used and a post-processing-like
        correction of the FSC curves (with phase-randomisation) is performed every
        iteration. This only works when a reference mask is provided on the I/O tab.
        This may yield higher-resolution maps, especially when the mask contains only
        a relatively small volume inside the box.
      warnings: []
    - key: do_blush
      gui_label: Use Blush regularisation?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, relion_refine will use a neural network to perform regularisation
        by denoising at every iteration, instead of the standard smoothness regularisation.
      warnings: []
    - key: sampling
      gui_label: 'Initial angular sampling:'
      option_type: radio
      required_for_addjob: false
      default: 2
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_sampling_options
      help: 'There are only a few discrete angular samplings possible because we use
        the HealPix library to generate the sampling of the first two Euler angles
        on the sphere. The samplings are approximate numbers and vary slightly over
        the sphere. Note that this will only be the value for the first few iteration(s):
        the sampling rate will be increased automatically after that.'
      warnings: []
    - key: offset_range
      gui_label: 'Initial offset range (pix):'
      option_type: number
      required_for_addjob: false
      default: 5
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'Probabilities will be calculated only for translations in a circle with
        this radius (in pixels). The center of this circle changes at every iteration
        and is placed at the optimal translation for each image in the previous iteration.
        Note that this will only be the value for the first few iteration(s): the
        sampling rate will be increased automatically after that.'
      warnings: []
    - key: offset_step
      gui_label: 'Initial offset step (pix):'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'Translations will be sampled with this step-size (in pixels).Translational
        sampling is also done using the adaptive approach. Therefore, if adaptive=1,
        the translations will first be evaluated on a 2x coarser grid. Note that this
        will only be the value for the first few iteration(s): the sampling rate will
        be increased automatically after that.'
      warnings: []
    - key: auto_local_sampling
      gui_label: 'Local searches from auto-sampling:'
      option_type: radio
      required_for_addjob: false
      default: 4
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_sampling_options
      help: In the automated procedure to increase the angular samplings, local angular
        searches of -6/+6 times the sampling rate will be used from this angular sampling
        rate onwards. For most lower-symmetric particles a value of 1.8 degrees will
        be sufficient. Perhaps icosahedral symmetries may benefit from a smaller value
        such as 0.9 degrees.
      warnings: []
    - key: relax_sym
      gui_label: 'Relax symmetry:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: With this option, poses related to the standard local angular search range
        by the given point group will also be explored. For example, if you have a
        pseudo-symmetric dimer A-A', refinement or classification in C1 with symmetry
        relaxation by C2 might be able to improve distinction between A and A'. Note
        that the reference must be more-or-less aligned to the convention of (pseudo-)symmetry
        operators. For details, see Ilca et al 2019 and Abrishami et al 2020 cited
        in the About dialog.
      warnings: []
    - key: auto_faster
      gui_label: Use finer angular sampling faster?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'If set to Yes, then let auto-refinement proceed faster with finer angular
        samplings. Two additional command-line options will be passed to the refine
        program: --auto_ignore_angles lets angular sampling go down despite changes
        still happening in the angles --auto_resol_angles lets angular sampling go
        down if the current resolution already requires that sampling at the edge
        of the particle. This option will make the computation faster, but hasn''t
        been tested for many cases for potential loss in reconstruction quality upon
        convergence.'
      warnings: []
    - key: sigma_tilt
      gui_label: 'Prior width on tilt angle (deg):'
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'The width of the prior on the tilt angle: angular searches will be +/-3
        times this value. Tilt priors will be defined when particles have been picked
        as filaments, on spheres or on manifolds. Setting this width to a negative
        value will lead to no prior being used on the tilt angle.'
      warnings: []
    - key: do_helix
      gui_label: Do helical reconstruction?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then perform 3D helical reconstruction.
      warnings: []
    - key: helical_tube_inner_diameter
      gui_label: 'Tube diameter - inner (A):'
      option_type: string
      required_for_addjob: false
      default: '-1'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Inner and outer diameter (in Angstroms) of the reconstructed helix spanning
        across Z axis. Set the inner diameter to negative value if the helix is not
        hollow in the center. The outer diameter should be slightly larger than the
        actual width of helical tubes because it also decides the shape of 2D particle
        mask for each segment. If the psi priors of the extracted segments are not
        accurate enough due to high noise level or flexibility of the structure, then
        set the outer diameter to a large value.
      warnings: []
    - key: helical_tube_outer_diameter
      gui_label: 'Tube diameter - outer (A):'
      option_type: string
      required_for_addjob: false
      default: '-1'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Inner and outer diameter (in Angstroms) of the reconstructed helix spanning
        across Z axis. Set the inner diameter to negative value if the helix is not
        hollow in the center. The outer diameter should be slightly larger than the
        actual width of helical tubes because it also decides the shape of 2D particle
        mask for each segment. If the psi priors of the extracted segments are not
        accurate enough due to high noise level or flexibility of the structure, then
        set the outer diameter to a large value.
      warnings: []
    - key: range_rot
      gui_label: 'Angular search range - rot (deg):'
      option_type: string
      required_for_addjob: false
      default: '-1'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local angular searches will be performed within +/- of the given amount
        (in degrees) from the optimal orientation in the previous iteration. The default
        negative value means that no local searches will be performed. A Gaussian
        prior will be applied, so that orientations closer to the optimal orientation
        in the previous iteration will get higher weights than those further away.
        These ranges will only be applied to the rot, tilt and psi angles in the first
        few iterations (global searches for orientations) in 3D helical reconstruction.
        Values of 9 or 15 degrees are commonly used. Higher values are recommended
        for more flexible structures and more memory and computation time will be
        used. A range of 15 degrees means sigma = 5 degrees. These options will be
        invalid if you choose to perform local angular searches or not to perform
        image alignment on 'Sampling' tab.
      warnings: []
    - key: range_tilt
      gui_label: 'Angular search range - tilt (deg):'
      option_type: string
      required_for_addjob: false
      default: '15'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local angular searches will be performed within +/- the given amount (in
        degrees) from the optimal orientation in the previous iteration. A Gaussian
        prior (also see previous option) will be applied, so that orientations closer
        to the optimal orientation in the previous iteration will get higher weights
        than those further away. These ranges will only be applied to the rot, tilt
        and psi angles in the first few iterations (global searches for orientations)
        in 3D helical reconstruction. Values of 9 or 15 degrees are commonly used.
        Higher values are recommended for more flexible structures and more memory
        and computation time will be used. A range of 15 degrees means sigma = 5 degrees.
        These options will be invalid if you choose to perform local angular searches
        or not to perform image alignment on 'Sampling' tab.
      warnings: []
    - key: range_psi
      gui_label: 'Angular search range - psi (deg):'
      option_type: string
      required_for_addjob: false
      default: '10'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local angular searches will be performed within +/- the given amount (in
        degrees) from the optimal orientation in the previous iteration. A Gaussian
        prior (also see previous option) will be applied, so that orientations closer
        to the optimal orientation in the previous iteration will get higher weights
        than those further away. These ranges will only be applied to the rot, tilt
        and psi angles in the first few iterations (global searches for orientations)
        in 3D helical reconstruction. Values of 9 or 15 degrees are commonly used.
        Higher values are recommended for more flexible structures and more memory
        and computation time will be used. A range of 15 degrees means sigma = 5 degrees.
        These options will be invalid if you choose to perform local angular searches
        or not to perform image alignment on 'Sampling' tab.
      warnings: []
    - key: do_apply_helical_symmetry
      gui_label: Apply helical symmetry?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, helical symmetry will be applied in every iteration. Set
        to No if you have just started a project, helical symmetry is unknown or not
        yet estimated.
      warnings: []
    - key: helical_nr_asu
      gui_label: 'Number of unique asymmetrical units:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of unique helical asymmetrical units in each segment box. If the
        inter-box distance (set in segment picking step) is 100 Angstroms and the
        estimated helical rise is ~20 Angstroms, then set this value to 100 / 20 =
        5 (nearest integer). This integer should not be less than 1. The correct value
        is essential in measuring the signal to noise ratio in helical reconstruction.
      warnings: []
    - key: helical_twist_initial
      gui_label: 'Initial helical twist (deg):'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Initial helical symmetry. Set helical twist (in degrees) to positive value
        if it is a right-handed helix. Helical rise is a positive value in Angstroms.
        If local searches of helical symmetry are planned, initial values of helical
        twist and rise should be within their respective ranges.
      warnings: []
    - key: helical_rise_initial
      gui_label: 'Initial helical rise (A):'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Initial helical symmetry. Set helical twist (in degrees) to positive value
        if it is a right-handed helix. Helical rise is a positive value in Angstroms.
        If local searches of helical symmetry are planned, initial values of helical
        twist and rise should be within their respective ranges.
      warnings: []
    - key: helical_z_percentage
      gui_label: 'Central Z length (%):'
      option_type: number
      required_for_addjob: false
      default: '30.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Reconstructed helix suffers from inaccuracies of orientation searches.
        The central part of the box contains more reliable information compared to
        the top and bottom parts along Z axis, where Fourier artefacts are also present
        if the number of helical asymmetrical units is larger than 1. Therefore, information
        from the central part of the box is used for searching and imposing helical
        symmetry in real space. Set this value (%) to the central part length along
        Z axis divided by the box size. Values around 30% are commonly used.
      warnings: []
    - key: do_local_search_helical_symmetry
      gui_label: Do local searches of symmetry?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then perform local searches of helical twist and rise within
        given ranges.
      warnings: []
    - key: helical_twist_min
      gui_label: 'Helical twist search (deg) - Min:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical twist search. Set helical
        twist (in degrees) to positive value if it is a right-handed helix. Generally
        it is not necessary for the user to provide an initial step (less than 1 degree,
        5~1000 samplings as default). But it needs to be set manually if the default
        value does not guarantee convergence. The program cannot find a reasonable
        symmetry if the true helical parameters fall out of the given ranges. Note
        that the final reconstruction can still converge if wrong helical and point
        group symmetry are provided.
      warnings: []
    - key: helical_twist_max
      gui_label: 'Helical twist search (deg) - Max:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical twist search. Set helical
        twist (in degrees) to positive value if it is a right-handed helix. Generally
        it is not necessary for the user to provide an initial step (less than 1 degree,
        5~1000 samplings as default). But it needs to be set manually if the default
        value does not guarantee convergence. The program cannot find a reasonable
        symmetry if the true helical parameters fall out of the given ranges. Note
        that the final reconstruction can still converge if wrong helical and point
        group symmetry are provided.
      warnings: []
    - key: helical_twist_inistep
      gui_label: 'Helical twist search (deg) - Step:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical twist search. Set helical
        twist (in degrees) to positive value if it is a right-handed helix. Generally
        it is not necessary for the user to provide an initial step (less than 1 degree,
        5~1000 samplings as default). But it needs to be set manually if the default
        value does not guarantee convergence. The program cannot find a reasonable
        symmetry if the true helical parameters fall out of the given ranges. Note
        that the final reconstruction can still converge if wrong helical and point
        group symmetry are provided.
      warnings: []
    - key: helical_rise_min
      gui_label: 'Helical rise search (A) - Min:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical rise search. Helical rise
        is a positive value in Angstroms. Generally it is not necessary for the user
        to provide an initial step (less than 1% the initial helical rise, 5~1000
        samplings as default). But it needs to be set manually if the default value
        does not guarantee convergence. The program cannot find a reasonable symmetry
        if the true helical parameters fall out of the given ranges. Note that the
        final reconstruction can still converge if wrong helical and point group symmetry
        are provided.
      warnings: []
    - key: helical_rise_max
      gui_label: 'Helical rise search (A) - Max:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical rise search. Helical rise
        is a positive value in Angstroms. Generally it is not necessary for the user
        to provide an initial step (less than 1% the initial helical rise, 5~1000
        samplings as default). But it needs to be set manually if the default value
        does not guarantee convergence. The program cannot find a reasonable symmetry
        if the true helical parameters fall out of the given ranges. Note that the
        final reconstruction can still converge if wrong helical and point group symmetry
        are provided.
      warnings: []
    - key: helical_rise_inistep
      gui_label: 'Helical rise search (A) - Step:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and initial step for helical rise search. Helical rise
        is a positive value in Angstroms. Generally it is not necessary for the user
        to provide an initial step (less than 1% the initial helical rise, 5~1000
        samplings as default). But it needs to be set manually if the default value
        does not guarantee convergence. The program cannot find a reasonable symmetry
        if the true helical parameters fall out of the given ranges. Note that the
        final reconstruction can still converge if wrong helical and point group symmetry
        are provided.
      warnings: []
    - key: helical_range_distance
      gui_label: 'Range factor of local averaging:'
      option_type: number
      required_for_addjob: false
      default: '-1.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local averaging of orientations and translations will be performed within
        a range of +/- this value * the box size. Polarities are also set to be the
        same for segments coming from the same tube during local refinement. Values
        of ~ 2.0 are recommended for flexible structures such as MAVS-CARD filaments,
        ParM, MamK, etc. This option might not improve the reconstructions of helices
        formed from curled 2D lattices (TMV and VipA/VipB). Set to negative to disable
        this option.
      warnings: []
    - key: keep_tilt_prior_fixed
      gui_label: 'Keep tilt-prior fixed:'
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to yes, the tilt prior will not change during the optimisation.
        If set to No, at each iteration the tilt prior will move to the optimal tilt
        value for that segment from the previous iteration.
      warnings: []
    - key: do_parallel_discio
      gui_label: Use parallel disc I/O?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, all MPI followers will read their own images from disc.
        Otherwise, only the leader will read images and send them through the network
        to the followers. Parallel file systems like gluster of fhgfs are good at
        parallel disc I/O. NFS may break with many followers reading in parallel.
        If your datasets contain particles with different box sizes, you have to say
        Yes.
      warnings: []
    - key: nr_pool
      gui_label: 'Number of pooled particles:'
      option_type: number
      required_for_addjob: false
      default: 3
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Particles are processed in individual batches by MPI followers. During
        each batch, a stack of particle images is only opened and closed once to improve
        disk access times. All particle images of a single batch are read into memory
        together. The size of these batches is at least one particle per thread used.
        The nr_pooled_particles parameter controls how many particles are read together
        for each thread. If it is set to 3 and one uses 8 threads, batches of 3x8=24
        particles will be read together. This may improve performance on systems where
        disk access, and particularly metadata handling of disk access, is a problem.
        It has a modest cost of increased RAM usage.
      warnings: []
    - key: do_pad1
      gui_label: Skip padding?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the calculations will not use padding in Fourier space
        for better interpolation in the references. Otherwise, references are padded
        2x before Fourier transforms are calculated. Skipping padding (i.e. use --pad
        1) gives nearly as good results as using --pad 2, but some artifacts may appear
        in the corners from signal that is folded back.
      warnings: []
    - key: do_preread_images
      gui_label: Pre-read all particles into RAM?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, all particle images will be read into computer memory,
        which will greatly speed up calculations on systems with slow disk access.
        However, one should of course be careful with the amount of RAM available.
        Because particles are read in float-precision, it will take ( N * box_size
        * box_size * 8 / (1024 * 1024 * 1024) ) Giga-bytes to read N particles into
        RAM. For 100 thousand 200x200 images, that becomes 15Gb, or 60 Gb for the
        same number of 400x400 particles. Remember that running a single MPI follower
        on each node that runs as many threads as available cores will have access
        to all available RAM. If parallel disc I/O is set to No, then only the leader
        reads all particles into RAM and sends those particles through the network
        to the MPI followers during the refinement iterations.
      warnings: []
    - key: scratch_dir
      gui_label: 'Copy particles to scratch directory:'
      option_type: string
      required_for_addjob: false
      default: std::string(default_scratch)
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If a directory is provided here, then the job will create a sub-directory
        in it called relion_volatile. If that relion_volatile directory already exists,
        it will be wiped. Then, the program will copy all input particles into a large
        stack inside the relion_volatile subdirectory. Provided this directory is
        on a fast local drive (e.g. an SSD drive), processing in all the iterations
        will be faster. If the job finishes correctly, the relion_volatile directory
        will be wiped. If the job crashes, you may want to remove it yourself.
      warnings: []
    - key: do_combine_thru_disc
      gui_label: Combine iterations through disc?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, at the end of every iteration all MPI followers will write
        out a large file with their accumulated results. The MPI leader will read
        in all these files, combine them all, and write out a new file with the combined
        results. All MPI salves will then read in the combined results. This reduces
        heavy load on the network, but increases load on the disc I/O. This will affect
        the time it takes between the progress-bar in the expectation step reaching
        its end (the mouse gets to the cheese) and the start of the ensuing maximisation
        step. It will depend on your system setup which is most efficient.
      warnings: []
    - key: use_gpu
      gui_label: Use GPU acceleration?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will try to use GPU acceleration.
      warnings: []
    - key: gpu_ids
      gui_label: 'Which GPUs to use:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'This argument is not necessary. If left empty, the job itself will try
        to allocate available GPU resources. You can override the default allocation
        by providing a list of which GPUs (0,1,2,3, etc) to use. MPI-processes are
        separated by '':'', threads by '',''. For example: ''0,0:1,1:0,0:1,1'''
      warnings: []
    - *id008
    - *id009
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: refined_volume
      result_name: refined_volume
      path_pattern: '{job_dir}/run_class*.mrc'
      warnings:
      - Source-derived manifest augmented with conservative output pattern for tests.
    - result_type: refine3d_particles
      result_name: refine3d_particles
      path_pattern: '{job_dir}/run_data.star'
      warnings:
      - RELION Refine3D run_data.star is refinement metadata and particles metadata.
    - result_type: half_maps
      result_name: half_maps
      path_pattern: '{job_dir}/run_half*_class*_unfil.mrc'
      warnings:
      - RELION Refine3D unfiltered half maps are consumed by post-processing.
    - result_type: fsc_curve
      result_name: fsc_curve
      path_pattern: '{job_dir}/*fsc*.star'
      warnings: []
    warnings: []
  MultiBody:
    relion_job_type: MultiBody
    proc_constant: PROC_MULTIBODY
    proc_label: relion.multibody
    dirname: MultiBody
    initializer: initialiseMultiBodyJob
    category: spa
    support_level: manifest_only
    has_mpi: true
    has_threads: true
    neutral_operation_candidates: []
    options:
    - key: fn_in
      gui_label: 'Consensus refinement optimiser.star: '
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: STAR Files (run_it*_optimiser.star)
      radio_choices: []
      help: Select the *_optimiser.star file for the iteration of the consensus refinement
        from which you want to start multi-body refinement.
      warnings: []
    - key: fn_cont
      gui_label: 'Continue from here: '
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: STAR Files (*_optimiser.star)
      radio_choices: []
      help: Select the *_optimiser.star file for the iteration from which you want
        to continue this multi-body refinement. Note that the Output rootname of the
        continued run and the rootname of the previous run cannot be the same. If
        they are the same, the program will automatically add a '_ctX' to the output
        rootname, with X being the iteration from which one continues the previous
        run.
      warnings: []
    - key: fn_bodies
      gui_label: 'Body STAR file:'
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: STAR Files (*.{star})
      radio_choices: []
      help: ''
      warnings: []
    - key: do_subtracted_bodies
      gui_label: Reconstruct subtracted bodies?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then the reconstruction of each of the bodies will use
        the subtracted images. This may give useful insights about how well the subtraction
        worked. If set to No, the original particles are used for reconstruction (while
        the subtracted ones are still used for alignment). This will result in fuzzy
        densities for bodies outside the one used for refinement.
      warnings: []
    - key: do_blush
      gui_label: Use Blush regularisation?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, relion_refine will use a neural network to perform regularisation
        by denoising at every iteration, instead of the standard smoothness regularisation.
      warnings: []
    - key: sampling
      gui_label: 'Initial angular sampling:'
      option_type: radio
      required_for_addjob: false
      default: 4
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_sampling_options
      help: 'There are only a few discrete angular samplings possible because we use
        the HealPix library to generate the sampling of the first two Euler angles
        on the sphere. The samplings are approximate numbers and vary slightly over
        the sphere. Note that this will only be the value for the first few iteration(s):
        the sampling rate will be increased automatically after that.'
      warnings: []
    - key: offset_range
      gui_label: 'Initial offset range (pix):'
      option_type: number
      required_for_addjob: false
      default: 3
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'Probabilities will be calculated only for translations in a circle with
        this radius (in pixels). The center of this circle changes at every iteration
        and is placed at the optimal translation for each image in the previous iteration.
        Note that this will only be the value for the first few iteration(s): the
        sampling rate will be increased automatically after that.'
      warnings: []
    - key: offset_step
      gui_label: 'Initial offset step (pix):'
      option_type: number
      required_for_addjob: false
      default: 0.75
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'Translations will be sampled with this step-size (in pixels).Translational
        sampling is also done using the adaptive approach. Therefore, if adaptive=1,
        the translations will first be evaluated on a 2x coarser grid. Note that this
        will only be the value for the first few iteration(s): the sampling rate will
        be increased automatically after that.'
      warnings: []
    - key: do_analyse
      gui_label: Run flexibility analysis?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
