      warnings: []
    - key: do_topaz_pick
      gui_label: Perform topaz picking?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set this option to Yes if you want to use a topaz model for autopicking.
      warnings: []
    - key: topaz_particle_diameter
      gui_label: 'Particle diameter (A) '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Diameter of the particle (to be used to infer topaz downscale factor and
        particle radius)
      warnings: []
    - key: topaz_nr_particles
      gui_label: 'Nr of particles per micrograph: '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Expected average number of particles per micrograph
      warnings: []
    - key: topaz_model
      gui_label: 'Trained topaz model: '
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: SAV Files (*.sav)
      radio_choices: []
      help: Trained topaz model for topaz-based picking. Use on job for training and
        a next job for picking. Leave this empty to use the default (general) model.
      warnings: []
    - key: fn_topaz_exe
      gui_label: 'Topaz executable:'
      option_type: string
      required_for_addjob: false
      default: relion_python_topaz
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Executable for running topaz. The default relion_python_topaz gets installed
        automatically through conda in a typical relion install. Only change this
        if this executable gives you problems.
      warnings: []
    - key: do_topaz_filaments
      gui_label: Pick filaments?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, this option will activate the -f option in our modified
        version of topaz that can pick filaments, as described in Lovestam & Scheres,
        Faraday Discussions 2022
      warnings: []
    - key: topaz_filament_threshold
      gui_label: 'Threshold:'
      option_type: string
      required_for_addjob: false
      default: '-5'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: "This sets the filament picking threshold and the length of the Hough\
        \ transform, as described in Lovestam & Scheres, Faraday Discussions 2022.\
        \ Useful values in our work on recombinant tau for the threshold range from\
        \ \xE2\x88\x924 to \xE2\x88\x927. We typically do not change the default length\
        \ of the Hough transform, which is set to be equal to the particle diameter\
        \ when a negative value is given here. You can provide the additional option\
        \ -fp to display images of intermediate steps of the algorithm to tune difficult\
        \ cases."
      warnings: []
    - key: topaz_hough_length
      gui_label: 'Hough length (A):'
      option_type: string
      required_for_addjob: false
      default: '-1'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: "This sets the filament picking threshold and the length of the Hough\
        \ transform, as described in Lovestam & Scheres, Faraday Discussions 2022.\
        \ Useful values in our work on recombinant tau for the threshold range from\
        \ \xE2\x88\x924 to \xE2\x88\x927. We typically do not change the default length\
        \ of the Hough transform, which is set to be equal to the particle diameter\
        \ when a negative value is given here. You can provide the additional option\
        \ -fp to display images of intermediate steps of the algorithm to tune difficult\
        \ cases."
      warnings: []
    - key: topaz_other_args
      gui_label: 'Additional topaz arguments:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: These additional arguments will be passed onto all topaz programs.
      warnings: []
    - key: do_refs
      gui_label: Use reference-based template-matching?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, 2D or 3D references, as defined on the References tab will
        be used for autopicking.
      warnings: []
    - key: fn_refs_autopick
      gui_label: '2D references:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_2DIMGS_CPIPE
      file_pattern: Input references (*.{star,mrcs})
      radio_choices: []
      help: Input STAR file or MRC stack with the 2D references to be used for picking.
        Note that the absolute greyscale needs to be correct, so only use images created
        by RELION itself, e.g. by 2D class averaging or projecting a RELION reconstruction.
      warnings: []
    - key: do_ref3d
      gui_label: 'OR: provide a 3D reference?'
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set this option to Yes if you want to provide a 3D map, which will be
        projected into multiple directions to generate 2D references.
      warnings: []
    - key: fn_ref3d_autopick
      gui_label: '3D reference:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MAP_CPIPE
      file_pattern: Input reference (*.{mrc})
      radio_choices: []
      help: Input MRC file with the 3D reference maps, from which 2D references will
        be made by projection. Note that the absolute greyscale needs to be correct,
        so only use maps created by RELION itself from this data set.
      warnings: []
    - key: ref3d_symmetry
      gui_label: 'Symmetry:'
      option_type: string
      required_for_addjob: false
      default: C1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Symmetry point group of the 3D reference. Only projections in the asymmetric
        part of the sphere will be generated.
      warnings: []
    - key: ref3d_sampling
      gui_label: '3D angular sampling:'
      option_type: radio
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_sampling_options
      help: There are only a few discrete angular samplings possible because we use
        the HealPix library to generate the sampling of the first two Euler angles
        on the sphere. The samplings are approximate numbers and vary slightly over
        the sphere. For autopicking, 30 degrees is usually fine enough, but for highly
        symmetrical objects one may need to go finer to adequately sample the asymmetric
        part of the sphere.
      warnings: []
    - key: lowpass
      gui_label: Lowpass filter references (A)
      option_type: number
      required_for_addjob: false
      default: 20
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Lowpass filter that will be applied to the references before template
        matching. Do NOT use very high-resolution templates to search your micrographs.
        The signal will be too weak at high resolution anyway, and you may find Einstein
        from noise.... Give a negative value to skip the lowpass filter.
      warnings: []
    - key: highpass
      gui_label: Highpass filter (A)
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Highpass filter that will be applied to the micrographs. This may be useful
        to get rid of background ramps due to uneven ice distributions. Give a negative
        value to skip the highpass filter. Useful values are often in the range of
        200-400 Angstroms.
      warnings: []
    - key: angpix_ref
      gui_label: Pixel size in references (A)
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Pixel size in Angstroms for the provided reference images. This will be
        used to calculate the filters and the particle diameter in pixels. If a negative
        value is given here, the pixel size in the references will be assumed to be
        the same as the one in the micrographs, i.e. the particles that were used
        to make the references were not rescaled upon extraction.
      warnings: []
    - key: psi_sampling_autopick
      gui_label: In-plane angular sampling (deg)
      option_type: number
      required_for_addjob: false
      default: 5
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Angular sampling in degrees for exhaustive searches of the in-plane rotations
        for all references.
      warnings: []
    - key: do_invert_refs
      gui_label: References have inverted contrast?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes to indicate that the reference have inverted contrast with
        respect to the particles in the micrographs.
      warnings: []
    - key: do_ctf_autopick
      gui_label: Are References CTF corrected?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes if the references were created with CTF-correction inside RELION.
        If set to Yes, the input micrographs can only be given as a STAR file, which
        should contain the CTF information for each micrograph.
      warnings: []
    - key: do_ignore_first_ctfpeak_autopick
      gui_label: Ignore CTFs until first peak?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set this to Yes, only if this option was also used to generate the references.
      warnings: []
    - key: threshold_autopick
      gui_label: 'Picking threshold:'
      option_type: number
      required_for_addjob: false
      default: 0.05
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Use lower thresholds to pick more particles (and more junk probably).
        This option is ignored in the Laplacian-of-Gaussian picker. Please use 'Adjust
        default threshold' in the 'Laplacian' tab instead.
      warnings: []
    - key: mindist_autopick
      gui_label: 'Minimum inter-particle distance (A):'
      option_type: number
      required_for_addjob: false
      default: 100
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Particles closer together than this distance will be consider to be a
        single cluster. From each cluster, only one particle will be picked. This
        option takes no effect for picking helical segments. The inter-box distance
        is calculated with the number of asymmetrical units and the helical rise on
        'Helix' tab. This option is also ignored in the Laplacian-of-Gaussian picker.
        The inter-box distance is calculated from particle diameters.
      warnings: []
    - key: maxstddevnoise_autopick
      gui_label: 'Maximum stddev noise:'
      option_type: number
      required_for_addjob: false
      default: 1.1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This is useful to prevent picking in carbon areas, or areas with big contamination
        features. Peaks in areas where the background standard deviation in the normalized
        micrographs is higher than this value will be ignored. Useful values are probably
        in the range 1.0 to 1.2. Set to -1 to switch off the feature to eliminate
        peaks due to high background standard deviations. This option is ignored in
        the Laplacian-of-Gaussian picker.
      warnings: []
    - key: minavgnoise_autopick
      gui_label: 'Minimum avg noise:'
      option_type: number
      required_for_addjob: false
      default: '-999.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This is useful to prevent picking in carbon areas, or areas with big contamination
        features. Peaks in areas where the background standard deviation in the normalized
        micrographs is higher than this value will be ignored. Useful values are probably
        in the range -0.5 to 0. Set to -999 to switch off the feature to eliminate
        peaks due to low average background densities. This option is ignored in the
        Laplacian-of-Gaussian picker.
      warnings: []
    - key: do_write_fom_maps
      gui_label: Write FOM maps?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, intermediate probability maps will be written out, which
        (upon reading them back in) will speed up tremendously the optimization of
        the threshold and inter-particle distance parameters. However, with this option,
        one cannot run in parallel, as disc I/O is very heavy with this option set.
      warnings: []
    - key: do_read_fom_maps
      gui_label: Read FOM maps?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If written out previously, read the FOM maps back in and re-run the picking
        to quickly find the optimal threshold and inter-particle distance parameters
      warnings: []
    - key: shrink
      gui_label: 'Shrink factor:'
      option_type: number
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This is useful to speed up the calculations, and to make them less memory-intensive.
        The micrographs will be downscaled (shrunk) to calculate the cross-correlations,
        and peak searching will be done in the downscaled FOM maps. When set to 0,
        the micrographs will de downscaled to the lowpass filter of the references,
        a value between 0 and 1 will downscale the micrographs by that factor. Note
        that the results will not be exactly the same when you shrink micrographs!
        In the Laplacian-of-Gaussian picker, this option is ignored and the shrink
        factor always becomes 0.
      warnings: []
    - key: use_gpu
      gui_label: Use GPU acceleration?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will try to use GPU acceleration. The Laplacian-of-Gaussian
        picker does not support GPU.
      warnings: []
    - key: gpu_ids
      gui_label: 'Which GPUs to use:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'This argument is not necessary. If left empty, the job itself will try
        to allocate available GPU resources. You can override the default allocation
        by providing a list of which GPUs (0,1,2,3, etc) to use. MPI-processes are
        separated by '':''. For example: 0:1:0:1:0:1'
      warnings: []
    - key: do_pick_helical_segments
      gui_label: Pick 2D helical segments?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes if you want to pick 2D helical segments. Note this will run
        the old algorithms for reference-based helical segment picking, as described
        by He & Scheres, J Struct Biol, 2017. Often, we now run filament picking from
        the Topaz tab instead....
      warnings: []
    - key: do_amyloid
      gui_label: Pick amyloid segments?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes if you want to use the algorithm that was developed specifically
        for picking amyloids.
      warnings: []
    - key: helical_tube_outer_diameter
      gui_label: 'Tube diameter (A): '
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Outer diameter (in Angstroms) of helical tubes. This value should be slightly
        larger than the actual width of the tubes.
      warnings: []
    - key: helical_nr_asu
      gui_label: 'Number of unique asymmetrical units:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of unique helical asymmetrical units in each segment box. This
        integer should not be less than 1. The inter-box distance (pixels) = helical
        rise (Angstroms) * number of asymmetrical units / pixel size (Angstroms).
        The optimal inter-box distance might also depend on the box size, the helical
        rise and the flexibility of the structure. In general, an inter-box distance
        of ~10% * the box size seems appropriate.
      warnings: []
    - key: helical_rise
      gui_label: 'Helical rise (A):'
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Helical rise in Angstroms. (Please click '?' next to the option above
        for details about how the inter-box distance is calculated.)
      warnings: []
    - key: helical_tube_kappa_max
      gui_label: 'Maximum curvature (kappa): '
      option_type: number
      required_for_addjob: false
      default: 0.1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Maximum curvature allowed for picking helical tubes. Kappa = 0.3 means
        that the curvature of the picked helical tubes should not be larger than 30%
        the curvature of a circle (diameter = particle mask diameter). Kappa ~ 0.05
        is recommended for long and straight tubes (e.g. TMV, VipA/VipB and AChR tubes)
        while 0.20 ~ 0.40 seems suitable for flexible ones (e.g. ParM and MAVS-CARD
        filaments).
      warnings: []
    - key: helical_tube_length_min
      gui_label: 'Minimum length (A): '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum length (in Angstroms) of helical tubes for auto-picking. Helical
        tubes with shorter lengths will not be picked. Note that a long helical tube
        seen by human eye might be treated as short broken pieces due to low FOM values
        or high picking threshold.
      warnings: []
    - *id008
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: picked_particles
      result_name: picked_particles
      path_pattern: '{job_dir}/autopick.star'
      warnings:
      - Source-derived manifest augmented with conservative AutoPick output pattern
        for tests.
    - result_type: topaz_model
      result_name: topaz_model
      path_pattern: '{job_dir}/model_epoch*.sav'
      warnings:
      - Source-derived manifest augmented with conservative Topaz training model output
        pattern for tests.
    warnings: []
  Extract:
    relion_job_type: Extract
    proc_constant: PROC_EXTRACT
    proc_label: relion.extract
    dirname: Extract
    initializer: initialiseExtractJob
    category: spa
    support_level: schedule_mappable
    has_mpi: true
    has_threads: false
    neutral_operation_candidates:
    - particle_extraction
    options:
    - key: star_mics
      gui_label: 'micrograph STAR file: '
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MICS_CPIPE
      file_pattern: Input STAR file (*.{star})
      radio_choices: []
      help: Filename of the STAR file that contains all micrographs from which to
        extract particles.
      warnings: []
    - key: coords_suffix
      gui_label: 'Input coordinates: '
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_COORDS_CPIPE
      file_pattern: Input coordinates list file (*.star)
      radio_choices: []
      help: Starfile with a 2-column list of micrograph names and corresponding coordinate
        filenames (in .star, .box or as 2 or 3-column free text format)
      warnings: []
    - key: do_reextract
      gui_label: 'OR re-extract refined particles? '
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the input Coordinates above will be ignored. Instead, one
        uses a _data.star file from a previous 2D or 3D refinement to re-extract the
        particles in that refinement, possibly re-centered with their refined origin
        offsets. This is particularly useful when going from binned to unbinned particles.
      warnings: []
    - key: fndata_reextract
      gui_label: 'Refined particles STAR file: '
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_PARTS_CPIPE
      file_pattern: Input STAR file (*.{star})
      radio_choices: []
      help: Filename of the STAR file with the refined particle coordinates, e.g.
        from a previous 2D or 3D classification or auto-refine run.
      warnings: []
    - key: do_reset_offsets
      gui_label: 'Reset the refined offsets to zero? '
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the input origin offsets will be reset to zero. This may
        be useful after 2D classification of helical segments, where one does not
        want neighbouring segments to be translated on top of each other for a subsequent
        3D refinement or classification.
      warnings: []
    - key: do_recenter
      gui_label: 'OR: re-center refined coordinates? '
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the input coordinates will be re-centered according to
        the refined origin offsets in the provided _data.star file. The unit is pixel,
        not angstrom. The origin is at the center of the box, not at the corner.
      warnings: []
    - key: recenter_x
      gui_label: 'Re-center on X-coordinate (in pix): '
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Re-extract particles centered on this X-coordinate (in pixels in the reference)
      warnings: []
    - key: recenter_y
      gui_label: 'Re-center on Y-coordinate (in pix): '
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Re-extract particles centered on this Y-coordinate (in pixels in the reference)
      warnings: []
    - key: recenter_z
      gui_label: 'Re-center on Z-coordinate (in pix): '
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Re-extract particles centered on this Z-coordinate (in pixels in the reference)
      warnings: []
    - key: extract_size
      gui_label: 'Particle box size (pix):'
      option_type: number
      required_for_addjob: false
      default: 128
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Size of the extracted particles (in pixels). This should be an even number!
      warnings: []
    - key: do_invert
      gui_label: Invert contrast?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the contrast in the particles will be inverted.
      warnings: []
    - key: do_float16
      gui_label: Write output in float16?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, this program will write output images in float16 MRC format.
        This will save a factor of two in disk space compared to the default of writing
        in float32. Note that RELION and CCPEM will read float16 images, but other
        programs may not (yet) do so.
      warnings: []
    - key: do_norm
      gui_label: Normalize particles?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, particles will be normalized in the way RELION prefers
        it.
      warnings: []
    - key: bg_diameter
      gui_label: 'Diameter background circle (pix): '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Particles will be normalized to a mean value of zero and a standard-deviation
        of one for all pixels in the background area.The background area is defined
        as all pixels outside a circle with this given diameter in pixels (before
        rescaling). When specifying a negative value, a default value of 75% of the
        Particle box size will be used.
      warnings: []
    - key: white_dust
      gui_label: 'Stddev for white dust removal: '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Remove very white pixels from the extracted particles. Pixels values higher
        than this many times the image stddev will be replaced with values from a
        Gaussian distribution. Use negative value to switch off dust removal.
      warnings: []
    - key: black_dust
      gui_label: 'Stddev for black dust removal: '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Remove very black pixels from the extracted particles. Pixels values higher
        than this many times the image stddev will be replaced with values from a
        Gaussian distribution. Use negative value to switch off dust removal.
      warnings: []
    - key: do_rescale
      gui_label: Rescale particles?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, particles will be re-scaled. Note that the particle diameter
        below will be in the down-scaled images.
      warnings: []
    - key: rescale
      gui_label: 'Re-scaled size (pixels): '
      option_type: number
      required_for_addjob: false
      default: 128
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The re-scaled value needs to be an even number
      warnings: []
    - key: do_fom_threshold
      gui_label: Use autopick FOM threshold?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, only particles with rlnAutopickFigureOfMerit values below
        the threshold below will be extracted.
      warnings: []
    - key: minimum_pick_fom
      gui_label: 'Minimum autopick FOM: '
      option_type: number
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The minimum value for the rlnAutopickFigureOfMerit for particles to be
        extracted.
      warnings: []
    - key: do_extract_helix
      gui_label: Extract helical segments?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes if you want to extract helical segments. RELION (.star), EMAN2
        (.box) and XIMDISP (.coords) formats of tube or segment coordinates are supported.
      warnings: []
    - key: helical_tube_outer_diameter
      gui_label: 'Tube diameter (A): '
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Outer diameter (in Angstroms) of helical tubes. This value should be slightly
        larger than the actual width of helical tubes.
      warnings: []
    - key: helical_bimodal_angular_priors
      gui_label: Use bimodal angular priors?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Normally it should be set to Yes and bimodal angular priors will be applied
        in the following classification and refinement jobs. Set to No if the 3D helix
        looks the same when rotated upside down.
      warnings: []
    - key: do_extract_helical_tubes
      gui_label: Coordinates are start-end only?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes if you want to extract helical segments from manually picked
        tube coordinates (starting and end points of helical tubes in RELION, EMAN
        or XIMDISP format). Set to No if segment coordinates (RELION auto-picked results
        or EMAN / XIMDISP segments) are provided.
      warnings: []
    - key: do_cut_into_segments
      gui_label: Cut helical tubes into segments?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes if you want to extract multiple helical segments with a fixed
        inter-box distance. If it is set to No, only one box at the center of each
        helical tube will be extracted.
      warnings: []
    - key: helical_nr_asu
      gui_label: 'Number of unique asymmetrical units:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of unique helical asymmetrical units in each segment box. This
        integer should not be less than 1. The inter-box distance (pixels) = helical
        rise (Angstroms) * number of asymmetrical units / pixel size (Angstroms).
        The optimal inter-box distance might also depend on the box size, the helical
        rise and the flexibility of the structure. In general, an inter-box distance
        of ~10% * the box size seems appropriate.
      warnings: []
    - key: helical_rise
      gui_label: 'Helical rise (A):'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Helical rise in Angstroms. (Please click '?' next to the option above
        for details about how the inter-box distance is calculated.)
      warnings: []
    - *id008
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: extracted_particles
      result_name: extracted_particles
      path_pattern: '{job_dir}/particles.star'
      warnings:
      - Source-derived manifest augmented with conservative Extract output pattern
        for tests.
    warnings: []
  Select:
    relion_job_type: Select
    proc_constant: PROC_CLASSSELECT
    proc_label: relion.select
    dirname: Select
    initializer: initialiseSelectJob
    category: spa
    support_level: manifest_only
    has_mpi: false
    has_threads: false
    neutral_operation_candidates:
    - particle_selection
    options:
    - key: fn_model
      gui_label: 'Select classes from job:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_OPTIMISER_CPIPE
      file_pattern: STAR files (*_optimiser.star)
      radio_choices: []
      help: A _optimiser.star (or for backwards compatibility also a _model.star)
        file from a previous 2D or 3D classification run to select classes from.
      warnings: []
    - key: fn_mic
      gui_label: 'OR select from micrographs.star:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MICS_CPIPE
      file_pattern: STAR files (*.star)
      radio_choices: []
      help: A micrographs.star file to select micrographs from.
      warnings: []
    - key: fn_data
      gui_label: 'OR select from particles.star:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_PARTS_CPIPE
      file_pattern: STAR files (*.star)
      radio_choices: []
      help: A particles.star file to select individual particles from.
      warnings: []
    - key: do_class_ranker
      gui_label: Automatically select 2D classes?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to True, the class_ranker program will be used to make an automated
        class selection, based on the parameters below. This option only works when
        selecting classes from a relion_refine job (input optimiser.star on the I.O
        tab)
      warnings: []
    - key: rank_threshold
      gui_label: 'Minimum threshold for auto-selection: '
      option_type: number
      required_for_addjob: false
      default: 0.5
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Only classes with a pre dicted threshold above this value will be selected.
      warnings: []
    - key: select_nr_parts
      gui_label: 'Select at least this many particles: '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Even if they have scores below the minimum threshold, select at least
        this many particles with the best scores.
      warnings: []
    - key: select_nr_classes
      gui_label: 'OR: select at least this many classes: '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Even if they have scores below the minimum threshold, select at least
        this many classes with the best scores.
      warnings: []
    - key: do_recenter
      gui_label: Re-center the class averages?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This option is only used when selecting particles from 2D classes. The
        selected class averages will all re-centered on their center-of-mass. This
        is useful when you plane to use these class averages as templates for auto-picking.
      warnings: []
    - key: do_regroup
      gui_label: Regroup the particles?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then the program will regroup the selected particles in
        'more-or-less' the number of groups indicated below. For re-grouping from
        individual particle _data.star files, a _model.star file with the same prefix
        should exist, i.e. the particle star file should be generated by relion_refine
      warnings: []
    - key: nr_groups
      gui_label: 'Approximate nr of groups: '
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: It is normal that the actual number of groups may deviate a little from
        this number.
      warnings: []
    - key: do_select_values
      gui_label: Select based on metadata values?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will be non-interactive and the selected star file
        will be based only on the value of the corresponding metadata label. Note
        that this option is only valid for micrographs or particles STAR files.
      warnings: []
    - key: select_label
      gui_label: 'Metadata label for subset selection:'
      option_type: string
      required_for_addjob: false
      default: rlnCtfMaxResolution
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This column from the input STAR file will be used for the subset selection.
      warnings: []
    - key: select_minval
      gui_label: 'Minimum metadata value:'
      option_type: string
      required_for_addjob: false
      default: '-9999.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Only lines in the input STAR file with the corresponding metadata value
        larger than or equal to this value will be included in the subset.
      warnings: []
    - key: select_maxval
      gui_label: 'Maximum metadata value:'
      option_type: string
      required_for_addjob: false
      default: '9999.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Only lines in the input STAR file with the corresponding metadata value
        smaller than or equal to this value will be included in the subset.
      warnings: []
    - key: do_discard
      gui_label: 'OR: select on image statistics?'
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will be non-interactive and all images in the input
        star file that have average and/or stddev pixel values that are more than
        the specified sigma-values away from the ensemble mean will be discarded.
      warnings: []
    - key: discard_label
      gui_label: 'Metadata label for images:'
      option_type: string
      required_for_addjob: false
      default: rlnImageName
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Specify which column from the input STAR contains the names of the images
        to be used to calculate the average and stddev values.
      warnings: []
    - key: discard_sigma
      gui_label: 'Sigma-value for discarding images:'
      option_type: number
      required_for_addjob: false
      default: 4
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Images with average and/or stddev values that are more than this many
        times the ensemble stddev away from the ensemble mean will be discarded.
      warnings: []
    - key: do_split
      gui_label: 'OR: split into subsets?'
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will be non-interactive and the star file will
        be split into subsets as defined below.
      warnings: []
    - key: do_random
      gui_label: 'Randomise order before making subsets?:'
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the input STAR file order will be randomised. If set to
        No, the original order in the input STAR file will be maintained.
      warnings: []
    - key: split_size
      gui_label: 'Subset size: '
      option_type: number
      required_for_addjob: false
      default: 100
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The number of lines in each of the output subsets. When this is -1, items
        are divided into a number of subsets specified in the next option.
      warnings: []
    - key: nr_split
      gui_label: 'OR: number of subsets: '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Give a positive integer to specify into how many equal-sized subsets the
        data will be divided. When the subset size is also specified, only this number
        of subsets, each with the specified size, will be written, possibly missing
        some items. When this is -1, all items are used, generating as many subsets
        as necessary.
      warnings: []
    - key: do_remove_duplicates
      gui_label: 'OR: remove duplicates?'
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, duplicated particles that are within a given distance are
        removed leaving only one. Duplicated particles are sometimes generated when
        particles drift into the same position during alignment. They inflate and
        invalidate gold-standard FSC calculation.
      warnings: []
    - key: duplicate_threshold
      gui_label: Minimum inter-particle distance (A)
      option_type: number
      required_for_addjob: false
      default: 30
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Particles within this distance are removed leaving only one.
      warnings: []
    - key: image_angpix
      gui_label: Pixel size before extraction (A)
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The pixel size of particles (relevant to rlnOriginX/Y) is read from the
        STAR file. When the pixel size of the original micrograph used for auto-picking
        and extraction (relevant to rlnCoordinateX/Y) is different, specify it here.
        In other words, this is the pixel size after binning during motion correction,
        but before down-sampling during extraction.
      warnings: []
    - key: do_filaments
      gui_label: 'OR: select filaments by dendrogram?'
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then the FilamentTools program by David Li will be used
        to perform a hierarchical clustering of the filaments, based on 2D class average
        assignments of their individual segments.
      warnings: []
    - key: dendrogram_threshold
      gui_label: 'Dendrogram threshold: '
      option_type: number
      required_for_addjob: false
      default: 0.85
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Lower thresholds will produce more clusters; After the dendrogram has
        been calculated in the initial running of this job, subsequent continuation
        jobs can quickly test other threshold values. The output logfile.pdf can be
        visualised to follow the process until a good threshold has been achieved.
      warnings: []
    - key: dendrogram_minclass
      gui_label: 'Minimum class size: '
      option_type: number
      required_for_addjob: false
      default: -1000
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to a positive value, then particle star files with clusters that
        have at least this number of particles will be written out. Keep th default
        negative value for faster testing of the threshold.
      warnings: []
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: selected_micrographs
      result_name: selected_micrographs
      path_pattern: '{job_dir}/micrographs_split*.star'
      warnings:
      - Source-derived manifest augmented with conservative Select micrograph split
        output pattern for tests.
    - result_type: selected_particles
      result_name: selected_particles
      path_pattern: '{job_dir}/particles.star'
      warnings:
      - Source-derived manifest augmented with conservative Select particle output
        pattern for tests.
    warnings: []
  Class2D:
    relion_job_type: Class2D
    proc_constant: PROC_2DCLASS
    proc_label: relion.class2d
    dirname: Class2D
    initializer: initialiseClass2DJob
    category: spa
    support_level: schedule_mappable
    has_mpi: true
    has_threads: true
    neutral_operation_candidates:
    - two_d_classification
    options:
    - key: fn_img
      gui_label: 'Input images STAR file:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_PARTS_CPIPE
      file_pattern: STAR files (*.star) Image stacks (not recommended, read help!)
        (*.{spi,mrcs})
      radio_choices: []
      help: A STAR file with all images (and their metadata). Alternatively, you may
        give a Spider/MRC stack of 2D images, but in that case NO metadata can be
        included and thus NO CTF correction can be performed, nor will it be possible
        to perform noise spectra estimation or intensity scale corrections in image
        groups. Therefore, running RELION with an input stack will in general provide
        sub-optimal results and is therefore not recommended!! Use the Preprocessing
        procedure to get the input STAR file in a semi-automated manner. Read the
        RELION wiki for more information.
      warnings: []
    - key: fn_cont
      gui_label: 'Continue from here: '
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: STAR Files (*_optimiser.star)
      radio_choices: []
      help: Select the *_optimiser.star file for the iteration from which you want
        to continue a previous run. Note that the Output rootname of the continued
        run and the rootname of the previous run cannot be the same. If they are the
        same, the program will automatically add a '_ctX' to the output rootname,
        with X being the iteration from which one continues the previous run.
      warnings: []
    - key: do_ctf_correction
      gui_label: Do CTF-correction?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, CTFs will be corrected inside the MAP refinement. The resulting
        algorithm intrinsically implements the optimal linear, or Wiener filter. Note
        that CTF parameters for all images need to be given in the input STAR file.
        The command 'relion_refine --print_metadata_labels' will print a list of all
        possible metadata labels for that STAR file. See the RELION Wiki for more
        details. Also make sure that the correct pixel size (in Angstrom) is given
        above!)
      warnings: []
    - key: ctf_intact_first_peak
      gui_label: Ignore CTFs until first peak?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'If set to Yes, then CTF-amplitude correction will only be performed from
        the first peak of each CTF onward. This can be useful if the CTF model is
        inadequate at the lowest resolution. Still, in general using higher amplitude
        contrast on the CTFs (e.g. 10-20%) often yields better results. Therefore,
        this option is not generally recommended: try increasing amplitude contrast
        (in your input STAR file) first!'
      warnings: []
    - key: nr_classes
      gui_label: 'Number of classes:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The number of classes (K) for a multi-reference refinement. These classes
        will be made in an unsupervised manner from a single reference by division
        of the data into random subsets during the first iteration.
      warnings: []
    - key: tau_fudge
      gui_label: 'Regularisation parameter T:'
      option_type: number
      required_for_addjob: false
      default: 2
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Bayes law strictly determines the relative weight between the contribution
        of the experimental data and the prior. However, in practice one may need
        to adjust this weight to put slightly more weight on the experimental data
        to allow optimal results. Values greater than 1 for this regularisation parameter
        (T in the JMB2011 paper) put more weight on the experimental data. Values
        around 2-4 have been observed to be useful for 3D refinements, values of 1-2
        for 2D refinements. Too small values yield too-low resolution structures;
        too high values result in over-estimated resolutions, mostly notable by the
        apparition of high-frequency noise in the references.
      warnings: []
    - key: do_em
      gui_label: Use EM algorithm?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the slower expectation-maximization algorithm will be used.
        This was the default option in releases prior to 4.0-beta. If set to No, then
        one needs to use the (faster) VDAM (variable metric gradient descent with
        adaptive moments) algorithm below. will be used.
      warnings: []
    - key: nr_iter_em
      gui_label: 'Number of EM iterations:'
      option_type: number
      required_for_addjob: false
      default: 25
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of EM iterations to be performed. Note that the current implementation
        of 2D class averaging and 3D classification does NOT comprise a convergence
        criterium. Therefore, the calculations will need to be stopped by the user
        if further iterations do not yield improvements in resolution or classes.
        Also note that upon restarting, the iteration number continues to be increased,
        starting from the final iteration in the previous run. The number given here
        is the TOTAL number of iterations. For example, if 10 iterations have been
        performed previously and one restarts to perform an additional 5 iterations
        (for example with a finer angular sampling), then the number given here should
        be 10+5=15.
      warnings: []
    - key: do_grad
      gui_label: Use VDAM algorithm?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the faster VDAM algorithm will be used. This algorithm
        was introduced with relion-4.0. If set to No, then the slower EM algorithm
        needs to be used.
      warnings: []
    - key: nr_iter_grad
      gui_label: 'Number of VDAM mini-batches:'
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Number of mini-batches to be processed using the VDAM algorithm. Using
        200 has given good results for many data sets. Using 100 will run faster,
        at the expense of some quality in the results.
      warnings: []
    - key: particle_diameter
      gui_label: 'Mask diameter (A):'
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The experimental images will be masked with a soft circular mask with
        this diameter. Make sure this radius is not set too small because that may
        mask away part of the signal! If set to a value larger than the image size
        no masking will be performed. The same diameter will also be used for a spherical
        mask of the reference structures if no user-provided mask is specified.
      warnings: []
    - key: do_zero_mask
      gui_label: Mask individual particles with zeros?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then in the individual particles, the area outside a circle
        with the radius of the particle will be set to zeros prior to taking the Fourier
        transform. This will remove noise and therefore increase sensitivity in the
        alignment and classification. However, it will also introduce correlations
        between the Fourier components that are not modelled. When set to No, then
        the solvent area is filled with random noise, which prevents introducing correlations.High-resolution
        refinements (e.g. ribosomes or other large complexes in 3D auto-refine) tend
        to work better when filling the solvent area with random noise (i.e. setting
        this option to No), refinements of smaller complexes and most classifications
        go better when using zeros (i.e. setting this option to Yes).
      warnings: []
    - key: highres_limit
      gui_label: 'Limit resolution E-step to (A): '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to a positive number, then the expectation step (i.e. the alignment)
        will be done only including the Fourier components up to this resolution (in
        Angstroms). This is useful to prevent overfitting, as the classification runs
        in RELION are not to be guaranteed to be 100% overfitting-free (unlike the
        3D auto-refine with its gold-standard FSC). In particular for very difficult
        data sets, e.g. of very small or featureless particles, this has been shown
        to give much better class averages. In such cases, values in the range of
        7-12 Angstroms have proven useful.
      warnings: []
    - key: do_center
      gui_label: Center class averages?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, every iteration the class average images will be centered
        on their center-of-mass. This will only work for positive signals, so the
        particles should be white.
      warnings: []
    - key: dont_skip_align
      gui_label: Perform image alignment?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to No, then rather than performing both alignment and classification,
        only classification will be performed. This allows the use of very focused
        masks.This requires that the optimal orientations of all particles are already
        stored in the input STAR file.
      warnings: []
    - key: psi_sampling
      gui_label: 'In-plane angular sampling:'
      option_type: number
      required_for_addjob: false
      default: '6.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'The sampling rate for the in-plane rotation angle (psi) in degrees. Using
        fine values will slow down the program. Recommended value for most 2D refinements:
        5 degrees. If auto-sampling is used, this will be the value for the first
        iteration(s) only, and the sampling rate will be increased automatically after
        that.'
      warnings: []
    - key: offset_range
      gui_label: 'Offset search range (pix):'
      option_type: number
      required_for_addjob: false
      default: 5
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Probabilities will be calculated only for translations in a circle with
        this radius (in pixels). The center of this circle changes at every iteration
        and is placed at the optimal translation for each image in the previous iteration.
        If auto-sampling is used, this will be the value for the first iteration(s)
        only, and the sampling rate will be increased automatically after that.
      warnings: []
    - key: offset_step
      gui_label: 'Offset search step (pix):'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Translations will be sampled with this step-size (in pixels).Translational
        sampling is also done using the adaptive approach. Therefore, if adaptive=1,
        the translations will first be evaluated on a 2x coarser grid. If auto-sampling
        is used, this will be the value for the first iteration(s) only, and the sampling
        rate will be increased automatically after that.
      warnings: []
    - key: allow_coarser
      gui_label: Allow coarser sampling?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the program will use coarser angular and translational
        samplings if the estimated accuracies of the assignments is still low in the
        earlier iterations. This may speed up the calculations.
      warnings: []
    - key: do_helix
      gui_label: Classify 2D helical segments?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes if you want to classify 2D helical segments. Note that the
        helical segments should come with priors of psi angles
      warnings: []
    - key: helical_tube_outer_diameter
      gui_label: 'Tube diameter (A): '
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Outer diameter (in Angstroms) of helical tubes. This value should be slightly
        larger than the actual width of the tubes. You may want to copy the value
        from previous particle extraction job. If negative value is provided, this
        option is disabled and ordinary circular masks will be applied. Sometimes
        '--dont_check_norm' option is useful to prevent errors in normalisation of
        helical segments.
      warnings: []
    - key: do_bimodal_psi
      gui_label: Do bimodal angular searches?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Do bimodal search for psi angles? Set to Yes if you want to classify 2D
        helical segments with priors of psi angles. The priors should be bimodal due
        to unknown polarities of the segments. Set to No if the 3D helix looks the
        same when rotated upside down. If it is set to No, ordinary angular searches
        will be performed. This option will be invalid if you choose not to perform
        image alignment on 'Sampling' tab.
      warnings: []
    - key: range_psi
      gui_label: 'Angular search range - psi (deg):'
      option_type: number
      required_for_addjob: false
      default: 6
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Local angular searches will be performed within +/- the given amount (in
        degrees) from the psi priors estimated through helical segment picking. A
        range of 15 degrees is the same as sigma = 5 degrees. Note that the ranges
        of angular searches should be much larger than the sampling. This option will
        be invalid if you choose not to perform image alignment on 'Sampling' tab.
      warnings: []
    - key: do_restrict_xoff
      gui_label: 'Restrict helical offsets to rise:'
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Set to Yes if you want to restrict the translational offsets along the
        helices to the rise of the helix given below. Set to No to allow free (conventional)
        translational offsets.
      warnings: []
    - key: helical_rise
      gui_label: 'Helical rise (A):'
      option_type: number
      required_for_addjob: false
      default: 4.75
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The helical rise (in Angstroms). Translational offsets along the helical
        axis will be limited from -rise/2 to +rise/2, with a flat prior.
      warnings: []
    - key: nr_pool
      gui_label: 'Number of pooled particles:'
      option_type: number
      required_for_addjob: false
      default: 3
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Particles are processed in individual batches by MPI followers. During
        each batch, a stack of particle images is only opened and closed once to improve
        disk access times. All particle images of a single batch are read into memory
        together. The size of these batches is at least one particle per thread used.
        The nr_pooled_particles parameter controls how many particles are read together
        for each thread. If it is set to 3 and one uses 8 threads, batches of 3x8=24
        particles will be read together. This may improve performance on systems where
        disk access, and particularly metadata handling of disk access, is a problem.
        It has a modest cost of increased RAM usage.
      warnings: []
    - key: do_parallel_discio
      gui_label: Use parallel disc I/O?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, all MPI followers will read images from disc. Otherwise,
        only the leader will read images and send them through the network to the
        followers. Parallel file systems like gluster of fhgfs are good at parallel
        disc I/O. NFS may break with many followers reading in parallel. If your datasets
        contain particles with different box sizes, you have to say Yes.
      warnings: []
    - key: do_preread_images
      gui_label: Pre-read all particles into RAM?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, all particle images will be read into computer memory,
        which will greatly speed up calculations on systems with slow disk access.
        However, one should of course be careful with the amount of RAM available.
        Because particles are read in float-precision, it will take ( N * box_size
        * box_size * 4 / (1024 * 1024 * 1024) ) Giga-bytes to read N particles into
        RAM. For 100 thousand 200x200 images, that becomes 15Gb, or 60 Gb for the
        same number of 400x400 particles. Remember that running a single MPI follower
        on each node that runs as many threads as available cores will have access
        to all available RAM. If parallel disc I/O is set to No, then only the leader
        reads all particles into RAM and sends those particles through the network
        to the MPI followers during the refinement iterations.
      warnings: []
    - key: scratch_dir
      gui_label: 'Copy particles to scratch directory:'
      option_type: string
      required_for_addjob: false
      default: std::string(default_scratch)
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If a directory is provided here, then the job will create a sub-directory
        in it called relion_volatile. If that relion_volatile directory already exists,
        it will be wiped. Then, the program will copy all input particles into a large
        stack inside the relion_volatile subdirectory. Provided this directory is
        on a fast local drive (e.g. an SSD drive), processing in all the iterations
        will be faster. If the job finishes correctly, the relion_volatile directory
        will be wiped. If the job crashes, you may want to remove it yourself.
      warnings: []
    - key: do_combine_thru_disc
      gui_label: Combine iterations through disc?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, at the end of every iteration all MPI followers will write
        out a large file with their accumulated results. The MPI leader will read
        in all these files, combine them all, and write out a new file with the combined
        results. All MPI salves will then read in the combined results. This reduces
        heavy load on the network, but increases load on the disc I/O. This will affect
        the time it takes between the progress-bar in the expectation step reaching
        its end (the mouse gets to the cheese) and the start of the ensuing maximisation
        step. It will depend on your system setup which is most efficient.
      warnings: []
    - key: use_gpu
      gui_label: Use GPU acceleration?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will try to use GPU acceleration.
      warnings: []
    - key: gpu_ids
      gui_label: 'Which GPUs to use:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'This argument is not necessary. If left empty, the job itself will try
        to allocate available GPU resources. You can override the default allocation
        by providing a list of which GPUs (0,1,2,3, etc) to use. MPI-processes are
        separated by '':'', threads by '',''. For example: ''0,0:1,1:0,0:1,1'''
      warnings: []
    - *id008
    - *id009
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: two_d_classes
      result_name: class2d_model
      path_pattern: '{job_dir}/run_it*_model.star'
      warnings:
      - Source-derived manifest augmented with conservative output pattern for tests.
    - result_type: selected_particles
      result_name: class2d_particles
      path_pattern: '{job_dir}/run_it*_data.star'
      warnings:
      - RELION Class2D run_it*_data.star may contain selected particles or class metadata.
    warnings: []
  InitialModel:
    relion_job_type: InitialModel
    proc_constant: PROC_INIMODEL
    proc_label: relion.initialmodel
    dirname: InitialModel
    initializer: initialiseInimodelJob
    category: spa
    support_level: schedule_mappable
    has_mpi: true
    has_threads: true
    neutral_operation_candidates:
    - initial_model
    options:
    - key: fn_img
      gui_label: 'Input images STAR file:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_PARTS_CPIPE
      file_pattern: STAR files (*.star) Image stacks (not recommended, read help!)
        (*.{spi,mrcs})
      radio_choices: []
      help: A STAR file with all images (and their metadata). In Gradient optimisation,
        it is very important that there are particles from enough different orientations.
        One only needs a few thousand to 10k particles. When selecting good 2D classes
        in the Subset Selection jobtype, use the option to select a maximum number
        of particles from each class to generate more even angular distributions for
        SGD. Alternatively, you may give a Spider/MRC stack of 2D images, but in that
        case NO metadata can be included and thus NO CTF correction can be performed,
        nor will it be possible to perform noise spectra estimation or intensity scale
        corrections in image groups. Therefore, running RELION with an input stack
        will in general provide sub-optimal results and is therefore not recommended!!
        Use the Preprocessing procedure to get the input STAR file in a semi-automated
        manner. Read the RELION wiki for more information.
      warnings: []
    - key: fn_cont
      gui_label: 'Continue from here: '
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: STAR Files (*_optimiser.star)
      radio_choices: []
      help: Select the *_optimiser.star file for the iteration from which you want
        to continue a previous run. Note that the Output rootname of the continued
        run and the rootname of the previous run cannot be the same. If they are the
        same, the program will automatically add a '_ctX' to the output rootname,
        with X being the iteration from which one continues the previous run.
      warnings: []
    - key: nr_iter
      gui_label: 'Number of VDAM mini-batches:'
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: How many iterations (i.e. mini-batches) to perform with the VDAM algorithm?
      warnings: []
    - key: tau_fudge
      gui_label: 'Regularisation parameter T:'
      option_type: number
      required_for_addjob: false
      default: 4
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Bayes law strictly determines the relative weight between the contribution
        of the experimental data and the prior. However, in practice one may need
        to adjust this weight to put slightly more weight on the experimental data
        to allow optimal results. Values greater than 1 for this regularisation parameter
        (T in the JMB2011 paper) put more weight on the experimental data. Values
        around 2-4 have been observed to be useful for 3D initial model calculations
      warnings: []
    - key: nr_classes
      gui_label: 'Number of classes:'
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The number of classes (K) for a multi-reference ab initio SGD refinement.
        These classes will be made in an unsupervised manner, starting from a single
        reference in the initial iterations of the SGD, and the references will become
        increasingly dissimilar during the inbetween iterations.
      warnings: []
    - key: sym_name
      gui_label: 'Symmetry:'
      option_type: string
      required_for_addjob: false
      default: C1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The initial model is always generated in C1 and then aligned to and symmetrized
        with the specified point group. If the automatic alignment fails, please manually
        rotate run_itNNN_class001.mrc (NNN is the number of iterations) so that it
        conforms the symmetry convention.
      warnings: []
    - key: do_run_C1
      gui_label: 'Run in C1 and apply symmetry later? '
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the gradient-driven optimisation is run in C1 and the symmetry
        orientation is searched and applied later. If set to No, the entire optimisation
        is run in the symmetry point group indicated above.
      warnings: []
    - key: particle_diameter
      gui_label: 'Mask diameter (A):'
      option_type: number
      required_for_addjob: false
      default: 200
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The experimental images will be masked with a soft circular mask with
        this diameter. Make sure this radius is not set too small because that may
        mask away part of the signal! If set to a value larger than the image size
        no masking will be performed. The same diameter will also be used for a spherical
        mask of the reference structures if no user-provided mask is specified.
      warnings: []
    - key: do_solvent
      gui_label: Flatten and enforce non-negative solvent?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will apply a spherical mask and enforce all values
        in the reference to be non-negative.
      warnings: []
    - key: sigma_tilt
      gui_label: 'Prior width on tilt angle (deg):'
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'The width of the prior on the tilt angle: angular searches will be +/-3
        times this value. Tilt priors will be defined when particles have been picked
        as filaments, on spheres or on manifolds. Setting this width to a negative
        value will lead to no prior being used on the tilt angle.'
      warnings: []
    - key: do_ctf_correction
      gui_label: Do CTF-correction?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, CTFs will be corrected inside the MAP refinement. The resulting
        algorithm intrinsically implements the optimal linear, or Wiener filter. Note
        that CTF parameters for all images need to be given in the input STAR file.
        The command 'relion_refine --print_metadata_labels' will print a list of all
        possible metadata labels for that STAR file. See the RELION Wiki for more
        details. Also make sure that the correct pixel size (in Angstrom) is given
        above!)
      warnings: []
    - key: ctf_intact_first_peak
      gui_label: Ignore CTFs until first peak?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'If set to Yes, then CTF-amplitude correction will only be performed from
        the first peak of each CTF onward. This can be useful if the CTF model is
        inadequate at the lowest resolution. Still, in general using higher amplitude
        contrast on the CTFs (e.g. 10-20%) often yields better results. Therefore,
        this option is not generally recommended: try increasing amplitude contrast
        (in your input STAR file) first!'
      warnings: []
    - key: do_parallel_discio
      gui_label: Use parallel disc I/O?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, all MPI followers will read their own images from disc.
        Otherwise, only the leader will read images and send them through the network
        to the followers. Parallel file systems like gluster of fhgfs are good at
        parallel disc I/O. NFS may break with many followers reading in parallel.
        If your datasets contain particles with different box sizes, you have to say
