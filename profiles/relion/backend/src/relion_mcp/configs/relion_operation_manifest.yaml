    - key: phase_min
      gui_label: 'Phase shift (deg) - Min:'
      option_type: string
      required_for_addjob: false
      default: '0'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and step size (in degrees) for the search of the phase
        shift
      warnings: []
    - key: phase_max
      gui_label: 'Phase shift (deg) - Max:'
      option_type: string
      required_for_addjob: false
      default: '180'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Minimum, maximum and step size (in degrees) for the search of the phase
