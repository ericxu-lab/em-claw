    proc_constant: PROC_POST
    proc_label: relion.postprocess
    dirname: PostProcess
    initializer: initialisePostprocessJob
    category: spa
    support_level: schedule_mappable
    has_mpi: false
    has_threads: false
    neutral_operation_candidates:
    - post_processing
    options:
    - key: fn_in
      gui_label: 'One of the 2 unfiltered half-maps:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_HALFMAP_CPIPE
      file_pattern: MRC map files (*half1*.mrc)
      radio_choices: []
      help: Provide one of the two unfiltered half-reconstructions that were output
        upon convergence of a 3D auto-refine run.
      warnings: []
    - key: fn_mask
      gui_label: 'Solvent mask:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MASK_CPIPE
      file_pattern: Image Files (*.{spi,vol,msk,mrc})
      radio_choices: []
      help: Provide a soft mask where the protein is white (1) and the solvent is
        black (0). Often, the softer the mask the higher resolution estimates you
        will get. A soft edge of 5-10 pixels is often a good edge width.
      warnings: []
    - key: angpix
      gui_label: Calibrated pixel size (A)
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Provide the final, calibrated pixel size in Angstroms. This value may
        be different from the pixel-size used thus far, e.g. when you have recalibrated
        the pixel size using the fit to a PDB model. The X-axis of the output FSC
        plot will use this calibrated value.
      warnings: []
    - key: do_auto_bfac
      gui_label: Estimate B-factor automatically?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then the program will use the automated procedure described
        by Rosenthal and Henderson (2003, JMB) to estimate an overall B-factor for
        your map, and sharpen it accordingly. Note that your map must extend well
        beyond the lowest resolution included in the procedure below, which should
        not be set to resolutions much lower than 10 Angstroms.
      warnings: []
    - key: autob_lowres
      gui_label: 'Lowest resolution for auto-B fit (A):'
      option_type: number
      required_for_addjob: false
      default: 10
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This is the lowest frequency (in Angstroms) that will be included in the
        linear fit of the Guinier plot as described in Rosenthal and Henderson (2003,
        JMB). Dont use values much lower or higher than 10 Angstroms. If your map
        does not extend beyond 10 Angstroms, then instead of the automated procedure
        use your own B-factor.
      warnings: []
    - key: do_adhoc_bfac
      gui_label: Use your own B-factor?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Instead of using the automated B-factor estimation, provide your own value.
        Use negative values for sharpening the map. This option is useful if your
        map does not extend beyond the 10A needed for the automated procedure, or
        when the automated procedure does not give a suitable value (e.g. in more
        disordered parts of the map).
      warnings: []
    - key: adhoc_bfac
      gui_label: 'User-provided B-factor:'
      option_type: number
      required_for_addjob: false
      default: -1000
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'Use negative values for sharpening. Be careful: if you over-sharpen your
        map, you may end up interpreting noise for signal!'
      warnings: []
    - key: fn_mtf
      gui_label: MTF of the detector (STAR file)
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: STAR Files (*.star)
      radio_choices: []
      help: If you know the MTF of your detector, provide it here. Curves for some
        well-known detectors may be downloaded from the RELION Wiki. Also see there
        for the exact format If you do not know the MTF of your detector and do not
        want to measure it, then by leaving this entry empty, you include the MTF
        of your detector in your overall estimated B-factor upon sharpening the map.Although
        that is probably slightly less accurate, the overall quality of your map will
        probably not suffer very much.
      warnings: []
    - key: mtf_angpix
      gui_label: 'Original detector pixel size:'
      option_type: number
      required_for_addjob: false
      default: 1.0
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This is the original pixel size (in Angstroms) in the raw (non-super-resolution!)
        micrographs.
      warnings: []
    - key: do_skip_fsc_weighting
      gui_label: Skip FSC-weighting?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to No (the default), then the output map will be low-pass filtered
        according to the mask-corrected, gold-standard FSC-curve. Sometimes, it is
        also useful to provide an ad-hoc low-pass filter (option below), as due to
        local resolution variations some parts of the map may be better and other
        parts may be worse than the overall resolution as measured by the FSC. In
        such cases, set this option to Yes and provide an ad-hoc filter as described
        below.
      warnings: []
    - key: low_pass
      gui_label: 'Ad-hoc low-pass filter (A):'
      option_type: number
      required_for_addjob: false
      default: 5
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This option allows one to low-pass filter the map at a user-provided frequency
        (in Angstroms). When using a resolution that is higher than the gold-standard
        FSC-reported resolution, take care not to interpret noise in the map for signal...
      warnings: []
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: refined_volume
      result_name: postprocessed_map
      path_pattern: '{job_dir}/postprocess.mrc'
    - result_type: fsc_curve
      result_name: postprocess_metadata
      path_pattern: '{job_dir}/postprocess.star'
    warnings: []
