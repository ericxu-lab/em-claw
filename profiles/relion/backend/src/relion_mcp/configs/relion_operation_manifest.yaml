    - key: angpix
      gui_label: Calibrated pixel size (A)
      option_type: number
      required_for_addjob: false
      default: 1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Provide the final, calibrated pixel size in Angstroms. This value may
        be different from the pixel-size used thus far, e.g. when you have recalibrated
        the pixel size using the fit to a PDB model. The X-axis of the output FSC
        plot will use this calibrated value.
      warnings: []
    - key: do_resmap_locres
      gui_label: Use ResMap?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then ResMap will be used for local resolution estimation.
      warnings: []
    - key: fn_resmap
      gui_label: 'ResMap executable:'
      option_type: filename
      required_for_addjob: false
      default: std::string(default_location)
      input_node_type: null
      file_pattern: ResMap*
      radio_choices: []
      help: Location of the ResMap executable. You can control the default of this
        field by setting environment variable RELION_RESMAP_EXECUTABLE, or by editing
        the first few lines in src/gui_jobwindow.h and recompile the code. Note that
        the ResMap wrapper cannot use MPI.
      warnings: []
    - key: fn_mask
      gui_label: 'User-provided solvent mask:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MASK_CPIPE
      file_pattern: Image Files (*.{spi,vol,msk,mrc})
      radio_choices: []
      help: Provide a mask with values between 0 and 1 around all domains of the complex.
        ResMap uses this mask for local resolution calculation. RELION does NOT use
        this mask for calculation, but makes a histogram of local resolution within
        this mask.
      warnings: []
    - key: pval
      gui_label: 'P-value:'
      option_type: number
      required_for_addjob: false
      default: 0.05
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This value is typically left at 0.05. If you change it, report the modified
        value in your paper!
      warnings: []
    - key: minres
      gui_label: 'Highest resolution (A): '
      option_type: number
      required_for_addjob: false
      default: '0.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: ResMaps minRes parameter. By default (0), the program will start at just
        above 2x the pixel size
      warnings: []
    - key: maxres
      gui_label: 'Lowest resolution (A): '
      option_type: number
      required_for_addjob: false
      default: '0.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: ResMaps maxRes parameter. By default (0), the program will stop at 4x
        the pixel size
      warnings: []
    - key: stepres
      gui_label: Resolution step size (A)
      option_type: number
      required_for_addjob: false
      default: '1.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: ResMaps stepSize parameter.
      warnings: []
    - key: do_relion_locres
      gui_label: Use Relion?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then relion_postprocess will be used for local-rtesolution
        estimation. This program basically performs a series of post-processing operations
        with a small soft, spherical mask that is moved over the entire map, while
        using phase-randomisation to estimate the convolution effects of that mask.
        The output relion_locres.mrc map can be used to color the surface of a map
        in UCSF Chimera according to its local resolution. The output relion_locres_filtered.mrc
        is a composite map that is locally filtered to the estimated resolution. This
        is a developmental feature in need of further testing, but initial results
        indicate it may be useful. Note that only this program can use MPI, the ResMap
        wrapper cannot use MPI.
      warnings: []
    - key: locres_sampling
      gui_label: 'Sampling rate (A):'
      option_type: number
      required_for_addjob: false
      default: 25
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The local-resolution map will be calculated every so many Angstroms, by
        placing soft spherical masks on a cubic grid with this spacing. Very fine
        samplings (e.g. < 15A?) may take a long time to compute and give spurious
        estimates!
      warnings: []
    - key: randomize_at
      gui_label: 'Frequency for phase-randomisation (A): '
      option_type: number
      required_for_addjob: false
      default: '10.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: From this frequency onwards, the phases for the mask-corrected FSC-calculation
        will be randomized. Make sure this is a lower resolution (i.e. a higher number)
        than the local resolutions you are after in your map.
      warnings: []
    - key: adhoc_bfac
      gui_label: 'User-provided B-factor:'
      option_type: number
      required_for_addjob: false
      default: -100
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: 'Probably, the overall B-factor as was estimated in the postprocess is
        a useful value for here. Use negative values for sharpening. Be careful: if
        you over-sharpen your map, you may end up interpreting noise for signal!'
      warnings: []
    - key: fn_mtf
      gui_label: MTF of the detector (STAR file)
      option_type: filename
      required_for_addjob: false
      default: ''
      input_node_type: null
      file_pattern: STAR Files (*.star)
      radio_choices: []
      help: The MTF of the detector is used to complement the user-provided B-factor
        in the sharpening. If you don't have this curve, you can leave this field
        empty.
      warnings: []
    - *id008
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: local_resolution_map
      result_name: local_resolution_map
      path_pattern: '{job_dir}/relion_locres.mrc'
      warnings:
      - Source-derived manifest augmented with conservative LocalRes output pattern
        for adoption.
    warnings: []
  Polish:
    relion_job_type: Polish
    proc_constant: PROC_MOTIONREFINE
    proc_label: relion.polish
    dirname: Polish
    initializer: initialiseMotionrefineJob
    category: spa
    support_level: schedule_mappable
    has_mpi: true
    has_threads: true
    neutral_operation_candidates: []
    options:
    - key: fn_mic
      gui_label: 'Micrographs (from MotionCorr):'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_MICS_CPIPE
      file_pattern: STAR files (*.star)
      radio_choices: []
      help: The input STAR file with the micrograph (and their movie metadata) from
        a MotionCorr job.
      warnings: []
    - key: fn_data
      gui_label: 'Particles (from Refine3D or CtfRefine):'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_PARTS_CPIPE
      file_pattern: STAR files (*.star)
      radio_choices: []
      help: The input STAR file with the metadata of all particles.
      warnings: []
    - key: fn_post
      gui_label: 'Postprocess STAR file:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_POSTPROCESS_CPIPE
      file_pattern: STAR files (postprocess.star)
      radio_choices: []
      help: The STAR file generated by a PostProcess job. The mask used for this postprocessing
        will be applied to the unfiltered half-maps and should encompass the entire
        complex. The resulting FSC curve will be used for weighting the different
        frequencies.
      warnings: []
    - key: do_float16
      gui_label: Write output in float16?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, this program will write output images in float16 MRC format.
        This will save a factor of two in disk space compared to the default of writing
        in float32. Note that RELION and CCPEM will read float16 images, but other
        programs may not (yet) do so.
      warnings: []
    - key: first_frame
      gui_label: 'First movie frame: '
      option_type: number
      required_for_addjob: false
      default: '1.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: First movie frame to take into account in motion fit and combination step
      warnings: []
    - key: last_frame
      gui_label: 'Last movie frame: '
      option_type: number
      required_for_addjob: false
      default: '-1.'
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Last movie frame to take into account in motion fit and combination step.
        Values equal to or smaller than 0 mean 'use all frames'.
      warnings: []
    - key: extract_size
      gui_label: 'Extraction size (pix in unbinned movie):'
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Size of the extracted particles in the unbinned original movie(in pixels).
        This should be an even number.
      warnings: []
    - key: rescale
      gui_label: 'Re-scaled size (pixels): '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The re-scaled value needs to be an even number.
      warnings: []
    - key: do_param_optim
      gui_label: Train optimal parameters?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then relion_motion_refine will estimate optimal parameter
        values for the three sigma values above on a subset of the data (determined
        by the minimum number of particles to be used below).
      warnings: []
    - key: eval_frac
      gui_label: 'Fraction of Fourier pixels for testing: '
      option_type: number
      required_for_addjob: false
      default: 0.5
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: This fraction of Fourier pixels (at higher resolution) will be used for
        evaluation of the parameters (test set), whereas the rest (at lower resolution)
        will be used for parameter estimation itself (work set).
      warnings: []
    - key: optim_min_part
      gui_label: 'Use this many particles: '
      option_type: number
      required_for_addjob: false
      default: 10000
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Use at least this many particles for the meta-parameter optimisation.
        The more particles the more expensive in time and computer memory the calculation
        becomes, but the better the results may get.
      warnings: []
    - key: do_polish
      gui_label: Perform particle polishing?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then relion_motion_refine will be run to estimate per-particle
        motion-tracks using the parameters below, and polished particles will be generated.
      warnings: []
    - key: opt_params
      gui_label: 'Optimised parameter file:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_POLISH_PARAMS
      file_pattern: TXT files (*.txt)
      radio_choices: []
      help: The output TXT file from a previous Bayesian polishing job in which the
        optimal parameters were determined.
      warnings: []
    - key: do_own_params
      gui_label: OR use your own parameters?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then the field for the optimised parameter file will be
        ignored and the parameters specified below will be used instead.
      warnings: []
    - key: sigma_vel
      gui_label: 'Sigma for velocity (A/dose): '
      option_type: number
      required_for_addjob: false
      default: 0.2
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Standard deviation for the velocity regularisation. Smaller values requires
        the tracks to be shorter.
      warnings: []
    - key: sigma_div
      gui_label: 'Sigma for divergence (A): '
      option_type: number
      required_for_addjob: false
      default: 5000
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Standard deviation for the divergence of tracks across the micrograph.
        Smaller values requires the tracks to be spatially more uniform in a micrograph.
      warnings: []
    - key: sigma_acc
      gui_label: 'Sigma for acceleration (A/dose): '
      option_type: number
      required_for_addjob: false
      default: 2
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: Standard deviation for the acceleration regularisation. Smaller values
        requires the tracks to be straighter.
      warnings: []
    - key: minres
      gui_label: 'Minimum resolution for B-factor fit (A): '
      option_type: number
      required_for_addjob: false
      default: 20
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The minimum spatial frequency (in Angstrom) used in the B-factor fit.
      warnings: []
    - key: maxres
      gui_label: 'Maximum resolution for B-factor fit (A): '
      option_type: number
      required_for_addjob: false
      default: -1
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The maximum spatial frequency (in Angstrom) used in the B-factor fit.
        If a negative value is given, the maximum is determined from the input FSC
        curve.
      warnings: []
    - *id008
    - *id009
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: polishing_parameters
      result_name: polishing_parameters
      path_pattern: '{job_dir}/opt_params_all_groups.txt'
    - result_type: polished_particles
      result_name: polished_particles
      path_pattern: '{job_dir}/shiny.star'
    warnings: []
  CtfRefine:
    relion_job_type: CtfRefine
    proc_constant: PROC_CTFREFINE
    proc_label: relion.ctfrefine
    dirname: CtfRefine
    initializer: initialiseCtfrefineJob
    category: spa
    support_level: schedule_mappable
    has_mpi: true
    has_threads: true
    neutral_operation_candidates:
    - ctf_refinement
    options:
    - key: fn_data
      gui_label: 'Particles (from Refine3D):'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_PARTS_CPIPE
      file_pattern: STAR files (*.star)
      radio_choices: []
      help: The input STAR file with the metadata of all particles.
      warnings: []
    - key: fn_post
      gui_label: 'Postprocess STAR file:'
      option_type: input_node
      required_for_addjob: false
      default: ''
      input_node_type: LABEL_POSTPROCESS_CPIPE
      file_pattern: STAR files (postprocess.star)
      radio_choices: []
      help: The STAR file generated by a PostProcess job. The mask used for this postprocessing
        will be applied to the unfiltered half-maps and should encompass the entire
        complex. The resulting FSC curve will be used for weighting the different
        frequencies. Note that for helices it is common practice to use a mask only
        encompassing the central 30% or so of the box. This gives higher resolution
        estimates, as it disregards ill-defined regions near the box edges. However,
        for ctf_refine it is better to use a mask encompassing (almost) the entire
        box, as otherwise there may not be enough signal.
      warnings: []
    - key: minres
      gui_label: 'Minimum resolution for fits (A): '
      option_type: number
      required_for_addjob: false
      default: 30
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: The minimum spatial frequency (in Angstrom) used in the beamtilt fit.
      warnings: []
    - key: do_ctf
      gui_label: Perform CTF parameter fitting?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then relion_ctf_refine will be used to estimate the selected
        parameters below.
      warnings: []
    - key: do_defocus
      gui_label: Fit defocus?
      option_type: radio
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_ctffit_options
      help: If set to per-particle or per-micrograph, then relion_ctf_refine will
        estimate defocus values.
      warnings: []
    - key: do_astig
      gui_label: Fit astigmatism?
      option_type: radio
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_ctffit_options
      help: If set to per-particle or per-micrograph, then relion_ctf_refine will
        estimate astigmatism.
      warnings: []
    - key: do_bfactor
      gui_label: Fit B-factor?
      option_type: radio
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_ctffit_options
      help: If set to per-particle or per-micrograph, then relion_ctf_refine will
        estimate B-factors that describe the signal falloff.
      warnings: []
    - key: do_phase
      gui_label: Fit phase-shift?
      option_type: radio
      required_for_addjob: false
      default: 0
      input_node_type: null
      file_pattern: null
      radio_choices:
      - job_ctffit_options
      help: If set to per-particle or per-micrograph, then relion_ctf_refine will
        estimate (VPP?) phase shift values.
      warnings: []
    - key: do_aniso_mag
      gui_label: Estimate (anisotropic) magnification?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then relion_ctf_refine will also estimate the (anisotropic)
        magnification per optics group. This option cannot be done simultaneously
        with higher-order aberration estimation. It's probably best to estimate the
        one that is most off first, and the other one second. It might be worth repeating
        the estimation if both are off.
      warnings: []
    - key: do_tilt
      gui_label: Estimate beamtilt?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then relion_ctf_refine will also estimate the beamtilt
        per optics group. This option is only recommended for data sets that extend
        beyond 4.5 Angstrom resolution.
      warnings: []
    - key: do_trefoil
      gui_label: Also estimate trefoil?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then relion_ctf_refine will also estimate the trefoil (3-fold
        astigmatism) per optics group. This option is only recommended for data sets
        that extend beyond 3.5 Angstrom resolution.
      warnings: []
    - key: do_4thorder
      gui_label: Estimate 4th order aberrations?
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, then relion_ctf_refine will also estimate the Cs and the
        tetrafoil (4-fold astigmatism) per optics group. This option is only recommended
        for data sets that extend beyond 3 Angstrom resolution.
      warnings: []
    - *id008
    - *id009
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expected_output_patterns:
    - result_type: ctf_refined_particles
      result_name: ctf_refined_particles
      path_pattern: '{job_dir}/particles_ctf_refine.star'
    warnings: []
  DynaMight:
    relion_job_type: DynaMight
    proc_constant: PROC_DYNAMIGHT
    proc_label: dynamight
    dirname: DynaMight
    initializer: initialiseDynaMightJob
    category: modelling
