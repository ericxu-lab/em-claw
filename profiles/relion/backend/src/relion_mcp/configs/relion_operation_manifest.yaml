      radio_choices: []
      help: CTFFIND's dAst parameter, GCTFs -astm parameter
      warnings: []
    - key: use_ctffind4
      gui_label: 'Use CTFFIND-4.1?'
      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the wrapper will use CTFFIND4 (version 4.1) for CTF estimation.
        This includes thread-support, calculation of Thon rings from movie frames and
        phase-shift estimation for phase-plate data.
      warnings: []
    - key: use_given_ps
      gui_label: Use power spectra from MotionCorr job?
      option_type: boolean
      required_for_addjob: false
      default: true
      input_node_type: null
      file_pattern: null
      radio_choices: []
