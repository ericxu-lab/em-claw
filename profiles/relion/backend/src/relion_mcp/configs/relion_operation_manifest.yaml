      option_type: boolean
      required_for_addjob: false
      default: false
      input_node_type: null
      file_pattern: null
      radio_choices: []
      help: If set to Yes, the job will try to use GPU acceleration.
      warnings: []
    - key: gpu_ids
      gui_label: 'Which GPUs to use:'
      option_type: string
      required_for_addjob: false
      default: ''
      input_node_type: null
